<title>Чёрный паук</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one-screen game — сверху карточка этапа (точки, задание, прогресс), сцена с пауками и букашками, снизу кнопки */
:root{
  --bg:#eef0e9; --web:#c7cbbd; --fg:#1b1c18; --muted:#6b6f62;
  --bubble:#ffffff; --accent:#d8432f; --spider:#141412; --violet:#7a3cc9; --red:#d6332b; --blue:#2350c8; --green:#2f9e44; --gold:#e8a816;
  --wing:rgb(160 190 215/.7); --track:rgb(27 28 24/.1); --poison:#2f6fe0;
  --display:"Rubik Mono One","Arial Black",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17181c; --web:#34363d; --fg:#ecebe6; --muted:#8e9099; --bubble:#2a2c33; --accent:#ff6a52;
  --spider:#050506; --violet:#9b5cf0; --red:#ff4d43; --blue:#4d7dff; --green:#4cc764; --gold:#f5c03a; --wing:rgb(190 215 240/.55); --track:rgb(236 235 230/.12); --poison:#5a95ff; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#17181c; --web:#34363d; --fg:#ecebe6; --muted:#8e9099; --bubble:#2a2c33; --accent:#ff6a52;
  --spider:#050506; --violet:#9b5cf0; --red:#ff4d43; --blue:#4d7dff; --green:#4cc764; --gold:#f5c03a; --wing:rgb(190 215 240/.55); --track:rgb(236 235 230/.12); --poison:#5a95ff; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;
  display:flex;flex-direction:column;align-items:center;padding:0 16px;box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
#web{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#web path,#web line{stroke:var(--web);fill:none;stroke-width:1.5}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}

/* ---- карточка этапа ---- */
.hud{position:relative;z-index:5;padding-block:14px 4px;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.hud.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.85);opacity:.3}100%{transform:scale(1);opacity:1}}
.steps{display:flex;gap:6px}
.steps i{width:10px;height:10px;border-radius:50%;background:var(--track);transition:background .3s,transform .3s}
.steps i.done{background:var(--gold)}
.steps i.now{background:var(--accent);transform:scale(1.35)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(18px,5.2vw,28px);line-height:1.15;margin:0;text-wrap:balance}
.hint{color:var(--muted);margin:0;font-size:15px;font-weight:600;text-wrap:balance}
.bars{width:100%;max-width:280px;display:flex;flex-direction:column;gap:4px;margin-top:2px}
.bar{height:12px;border-radius:999px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:var(--accent);transition:width .35s cubic-bezier(.3,1.4,.5,1)}
.bar.rival{height:8px}.bar.rival i{background:var(--red)}
.count{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.count b{font-family:var(--display);font-weight:400;color:var(--accent)}
.count em{font-style:normal;font-family:var(--display);color:var(--red)}
#replay{font:inherit;font-family:var(--display);font-size:16px;color:#fff;background:var(--accent);border:0;border-radius:999px;padding:12px 22px;cursor:pointer;margin-top:4px}

/* ---- сцена ---- */
.stage{position:relative;flex:1;width:100%;max-width:680px;overflow:hidden;touch-action:none}
#threads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#threads line{stroke:var(--muted);stroke-width:2}
#banner{position:absolute;left:50%;top:42%;translate:-50% -50%;z-index:8;pointer-events:none;
  font-family:var(--display);font-size:clamp(30px,10vw,56px);color:var(--gold);white-space:nowrap;
  text-shadow:0 3px 0 var(--accent),0 8px 24px rgb(0 0 0/.25);opacity:0}
#banner.show{animation:banner 1.7s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes banner{0%{opacity:0;scale:.3 .3;rotate:-8deg}18%{opacity:1;scale:1.1 1.1;rotate:3deg}30%{scale:1 1;rotate:0deg}80%{opacity:1}100%{opacity:0;scale:1.15 1.15}}

.sw{position:absolute;left:0;top:0;width:min(34vw,170px);z-index:3;will-change:transform}
.sw.purple{--spider:var(--violet);z-index:4}
.sw.red{--spider:var(--red);z-index:4}
.sw.blue{--spider:var(--blue);z-index:4}
.sw.green{--spider:var(--green);z-index:4}
.green .bubble b{color:var(--green)}
.tickled .sp{animation:laugh .16s infinite}
.tickled .legs-l{animation:wigL .16s infinite}.tickled .legs-r{animation:wigR .16s infinite}
.sw.yuck{--spider:#5f8f2e}
.sp{display:block;width:100%;background:none;border:0;padding:0;cursor:pointer;transform-origin:50% 0}
.sp:focus-visible{outline:3px dashed var(--accent);outline-offset:6px;border-radius:50%}
.sp svg{width:100%;height:auto;display:block;overflow:visible}
.body{fill:var(--spider);transition:fill .3s}
.leg{fill:none;stroke:var(--spider);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.eye{fill:#fff}.pupil{fill:#111}
.lids{display:none;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round}
.brow{stroke:#111;stroke-width:3;stroke-linecap:round;display:none}
.purple .brow,.red .brow{display:inline}
.legs-l,.legs-r{transform-origin:100px 100px}
.asleep .eye,.asleep .pupil{display:none}
.asleep .lids{display:inline}
.asleep .sp{animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{rotate:-4deg}50%{rotate:4deg}}
.zzz{position:absolute;left:62%;top:10%;display:none;font-family:var(--display);color:var(--muted);pointer-events:none}
.asleep .zzz{display:block}
.zzz span{position:absolute;opacity:0;animation:zz 3s infinite}
.zzz span:nth-child(2){animation-delay:1s;font-size:1.3em}
.zzz span:nth-child(3){animation-delay:2s;font-size:1.7em}
@keyframes zz{0%{opacity:0;translate:0 0}20%{opacity:1}100%{opacity:0;translate:30px -60px}}
.ring{position:absolute;left:50%;top:50.6%;width:150%;aspect-ratio:1;translate:-50% -50%;border:3px dashed var(--accent);border-radius:50%;
  opacity:.5;display:none;pointer-events:none;animation:spin 4s linear infinite}
.ring::after{content:"";position:absolute;top:-11px;left:50%;border:9px solid transparent;border-left:14px solid var(--accent);border-right:0}
.eyes .ring{display:block}

.jump{animation:jump .7s cubic-bezier(.2,.8,.3,1)}
.jump .legs-l{animation:wigL .7s}.jump .legs-r{animation:wigR .7s}
.crawl .legs-l{animation:wigL .25s infinite}.crawl .legs-r{animation:wigR .25s infinite}
.chomp{animation:chomp .18s 4}
.stir{animation:stir .5s}
.laugh{animation:laugh .16s 8}
.laugh .legs-l{animation:wigL .16s 8}.laugh .legs-r{animation:wigR .16s 8}
.sad{animation:sad .9s}
.shake{animation:shake .1s 6}
@keyframes jump{0%{translate:0 0;scale:1 1}12%{translate:0 10px;scale:1.12 .86}
  45%{translate:0 -90px;scale:.92 1.1}70%{translate:0 0;scale:1.08 .92}85%{scale:.97 1.03}100%{translate:0 0;scale:1 1}}
@keyframes wigL{0%,100%{rotate:0deg}50%{rotate:-14deg}}
@keyframes wigR{0%,100%{rotate:0deg}50%{rotate:14deg}}
@keyframes chomp{50%{scale:1.08 .9}}
@keyframes stir{25%{rotate:-10deg}75%{rotate:10deg}}
@keyframes laugh{0%,100%{translate:0 0;rotate:0deg}25%{translate:0 -8px;rotate:-6deg}75%{translate:0 -8px;rotate:6deg}}
@keyframes sad{30%{translate:0 8px;scale:1.05 .92}100%{translate:0 0}}
@keyframes shake{25%{translate:-6px 0}75%{translate:6px 0}}

.bubble{position:absolute;bottom:calc(100% - 16px);left:55%;transform:scale(.4);transform-origin:0 100%;opacity:0;
  background:var(--bubble);color:var(--fg);font-family:var(--display);font-size:clamp(12px,3.6vw,17px);
  padding:10px 14px;border-radius:18px;width:max-content;max-width:min(230px,62vw);line-height:1.25;text-wrap:balance;box-shadow:0 6px 20px rgb(0 0 0/.15);
  transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;pointer-events:none;z-index:6}
.bubble::after{content:"";position:absolute;left:16px;bottom:-10px;border:10px solid transparent;border-top-color:var(--bubble);border-bottom:0}
.bubble.show{opacity:1;transform:scale(1)}
.bubble.flip{left:auto;right:55%;transform-origin:100% 100%}
.bubble.flip::after{left:auto;right:16px}
.bubble b{color:var(--accent);font-weight:400}
.purple .bubble b{color:var(--violet)} .red .bubble b{color:var(--red)} .blue .bubble b{color:var(--blue)}
.purple .brow,.red .brow,.blue .brow{display:inline}

.bug{position:absolute;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;padding:0;border:0;background:none;
  cursor:pointer;z-index:2;will-change:transform}
.bug:focus-visible{outline:2px dashed var(--accent);border-radius:50%}
.bug svg{width:100%;height:100%;overflow:visible;transition:scale .2s}
.bug.caught svg{animation:wiggle .12s infinite}
.bug.gone svg{scale:0}
.bug.hunted::before{content:"";position:absolute;inset:2px;border:2px dashed var(--hc,var(--violet));border-radius:50%;opacity:.8;animation:spin 2s linear infinite}
.flap{animation:flap .08s infinite alternate;transform-box:fill-box}
.flapL{transform-origin:right center}.flapR{transform-origin:left center}
.slow{animation-duration:.22s}
.stink{animation:stink 1.4s ease-in-out infinite}
.bug.poison::after{content:"";position:absolute;inset:-4px;border-radius:50%;pointer-events:none;
  background:conic-gradient(var(--poison) calc(var(--p,1)*360deg),var(--track) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px))}
.bug.poison.caught::after{display:none}
.bug.hurry svg{animation:hurry .3s infinite}
@keyframes hurry{50%{scale:1.15 1.15}}
.cloud{position:absolute;left:0;top:0;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;pointer-events:none;z-index:7;
  background:radial-gradient(circle,rgb(70 120 230/.6),rgb(120 100 230/.25) 45%,transparent 70%);animation:cloud 1.4s ease-out forwards}
@keyframes cloud{0%{scale:.2 .2;opacity:1}100%{scale:2.2 2.2;opacity:0}}
.sw.poisoned{--spider:#2f5fb8}
.poisoned .sp{animation:dizzy .7s ease-in-out infinite}
@keyframes dizzy{0%,100%{rotate:-9deg}50%{rotate:9deg}}
@keyframes flap{to{scale:.25 1}}
@keyframes wiggle{50%{rotate:12deg}}
@keyframes spin{to{rotate:360deg}}
@keyframes stink{0%,100%{opacity:.2;translate:0 2px}50%{opacity:.9;translate:0 -3px}}

footer{position:relative;z-index:5;padding-block:8px 18px;display:flex;gap:10px;align-items:center;justify-content:center}
footer button{font:inherit;font-weight:800;font-size:14px;color:var(--fg);background:var(--bubble);border:1.5px solid var(--web);
  border-radius:999px;padding:8px 14px;cursor:pointer}
footer button:focus-visible,#replay:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.jump,.chomp,.flap,.laugh,.sad,.stir,.shake,.ring,.zzz span{animation-duration:.01s}}

/* ================= эпизод 2: комнаты ================= */
:root{ --wall:#e4e9e0; --wallbed:#e6e0ef; --dot:rgb(122 60 201/.12); --floor:#d6c7ad; --tile:#cfe2e8; --grout:rgb(255 255 255/.65);
  --porcelain:#ffffff; --line:rgb(27 28 24/.18); --wood:#a8794f; --wood2:#c99a6b; --water:#4ea3e6; --sheet:#f7f4ee;
  --blanket:#e9a23b; --blanket2:#d18a26; --night:#1d2550; --paper:#fbf6ea }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --wall:#252830; --wallbed:#28243a; --dot:rgb(155 92 240/.14);
  --floor:#3b342c; --tile:#22343b; --grout:rgb(255 255 255/.07); --porcelain:#e6eaee; --line:rgb(0 0 0/.35); --wood:#8a6040; --wood2:#a8794f;
  --water:#4d9be0; --sheet:#d9dce2; --blanket:#d8912e; --blanket2:#b97821; --night:#0c1030; --paper:#efe7d4 }}
:root[data-theme="dark"]{ --wall:#252830; --wallbed:#28243a; --dot:rgb(155 92 240/.14);
  --floor:#3b342c; --tile:#22343b; --grout:rgb(255 255 255/.07); --porcelain:#e6eaee; --line:rgb(0 0 0/.35); --wood:#8a6040; --wood2:#a8794f;
  --water:#4d9be0; --sheet:#d9dce2; --blanket:#d8912e; --blanket2:#b97821; --night:#0c1030; --paper:#efe7d4 }

[hidden]{display:none!important}
#banner{position:fixed;z-index:25}
.room{position:absolute;inset:0;overflow:hidden;border-radius:18px}
.room .wall{position:absolute;inset:0 0 22% 0;background:var(--wall)}
.room .floor{position:absolute;left:0;right:0;bottom:0;height:22%;background:var(--floor)}
.room.bath .wall{background-color:var(--tile);background-image:linear-gradient(var(--grout) 2px,transparent 2px),linear-gradient(90deg,var(--grout) 2px,transparent 2px);background-size:34px 34px}
.room.bedroom .wall{background-color:var(--wallbed);background-image:radial-gradient(var(--dot) 2.5px,transparent 3px);background-size:28px 28px}
.room.hall .wall{background:linear-gradient(transparent 68%,var(--wood2) 68% 70.5%,transparent 70.5%),var(--wall)}
.room svg{display:block;width:100%;height:auto;overflow:visible}
.obj{position:absolute;bottom:19%;translate:-50% 0;padding:0;border:0;background:none;cursor:pointer}
.toilet{width:min(30vw,140px)} .sink{width:min(26vw,120px)}
.toilet .lid-open{display:none} .toilet.open .lid-open{display:inline} .toilet.open .lid-closed{display:none}
.swirl{opacity:0;transform-box:fill-box;transform-origin:center}
.toilet.flush .swirl{animation:swirl 1.2s}
@keyframes swirl{20%{opacity:1}100%{opacity:0;rotate:720deg;scale:.2 .2}}
.sink .stream,.sink .suds{opacity:0;transition:opacity .2s} .sink.on .stream,.sink.on .suds{opacity:1}
.tapme{animation:tapme 1.4s ease-in-out infinite}
@keyframes tapme{0%,100%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 0 10px var(--gold)) drop-shadow(0 0 3px var(--gold))}}

.walker{left:50%;top:60%;translate:-50% -50%;width:min(28vw,130px);z-index:3;
  transition:left .9s ease-in-out,top .9s ease-in-out,width .5s,opacity .6s,scale .6s}
.walker.noanim{transition:none}
.walker.big{width:min(58vw,260px)} .walker.inbed{width:min(22vw,100px)} .walker.parent{width:min(32vw,150px)}
.walker.sitting .sp{scale:1 .86;translate:0 6%}
.walker.vanish{opacity:0;scale:.4 .4}
.walker.fly{animation:fly 1.2s cubic-bezier(.3,.7,.4,1)}
@keyframes fly{0%{translate:-50% -50%}45%{translate:-50% calc(-50% - 230px);rotate:200deg}100%{translate:-50% -50%;rotate:360deg}}
.hug{animation:hug .9s}
@keyframes hug{30%{scale:1.14 .88}60%{scale:.95 1.06}}
.sw.mom{--spider:#3a2740} .sw.dad{--spider:#20262f}
.bow,.specs,.teeth{display:none} .mom .bow,.dad .specs,.grin .teeth{display:inline} .grin .mouth{display:none}
.tooth{fill:var(--teeth,#fff)}

.mirror{position:absolute;left:50%;top:5%;translate:-50% 0;width:min(70vw,300px);height:60%;border-radius:999px 999px 24px 24px;
  background:linear-gradient(160deg,rgb(255 255 255/.6),rgb(200 225 240/.3));border:8px solid var(--wood)}
.brush{position:absolute;left:0;top:0;width:min(32vw,140px);margin:-5.7% 0 0 -14%;pointer-events:none;z-index:6;transform-origin:14% 20%}
.foam{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px;border-radius:50%;background:#fff;border:1.5px solid #cfe3f0;
  pointer-events:none;z-index:7;animation:foam 1.1s forwards}
@keyframes foam{to{opacity:0;translate:0 -18px;scale:1.5 1.5}}

.showerhead{position:absolute;left:50%;top:0;translate:-50% 0;width:min(34vw,150px);pointer-events:none}
.water{position:absolute;left:50%;top:calc(min(34vw,150px)*.6);bottom:26%;translate:-50% 0;width:min(34vw,150px);pointer-events:none;opacity:0;transition:opacity .3s;z-index:4;overflow:hidden}
.water.on{opacity:1}
.drop{position:absolute;top:-20px;width:3px;height:16px;border-radius:2px;background:var(--water);animation:drop .55s linear infinite}
@keyframes drop{to{top:100%}}
.tub{position:absolute;left:50%;bottom:13%;translate:-50% 0;width:min(72vw,320px);height:min(18vw,80px);background:var(--porcelain);
  border:2px solid var(--line);border-radius:12px 12px 48px 48px;z-index:5}
.valve{position:absolute;left:13%;top:34%;translate:-50% 0;width:min(16vw,70px);padding:0;border:0;background:none;cursor:pointer;z-index:5}
.valve svg{transition:rotate .4s} .valve.on svg{rotate:120deg}
.soap{position:absolute;left:0;top:0;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);border-radius:50%;pointer-events:none;z-index:6;
  background:radial-gradient(circle at 30% 30%,#fff,rgb(255 255 255/.55) 40%,rgb(170 205 255/.35));border:1.5px solid rgb(255 255 255/.95);
  animation:pop .25s;transition:translate 1.2s ease-in,opacity 1.2s}
.soap.rinse{translate:0 120px;opacity:0}

.door{position:absolute;bottom:22%;translate:-50% 0;width:min(22vw,100px);aspect-ratio:.52;padding:0;border:6px solid var(--wood);border-bottom:0;
  border-radius:10px 10px 0 0;background:none;cursor:pointer;perspective:500px}
.door .inside{position:absolute;inset:0;background:var(--in)}
.door[data-k="kitchen"]{--in:#f3c27a} .door[data-k="bath"]{--in:#9fd3ef} .door[data-k="bed"]{--in:#24305e}
.door .panel{position:absolute;inset:0;background:var(--wood2);transform-origin:left center;transition:transform .5s}
.door.open .panel{transform:rotateY(-80deg)}
.door .knob{position:absolute;right:12%;top:50%;width:9px;height:9px;border-radius:50%;background:var(--gold)}
.door .sign{position:absolute;left:50%;bottom:calc(100% + 12px);translate:-50% 0;width:70%;aspect-ratio:1;border-radius:50%;background:var(--porcelain);
  border:3px solid var(--wood);display:grid;place-items:center}
.door .sign svg{width:72%}

.window{position:absolute;left:18%;top:8%;translate:-50% 0;width:min(26vw,120px);aspect-ratio:1;border:6px solid var(--wood);border-radius:8px;overflow:hidden;background:var(--night)}
.star{animation:tw 1.8s ease-in-out infinite alternate} .star:nth-child(odd){animation-delay:.9s}
@keyframes tw{to{opacity:.25}}
.bed{position:absolute;right:3%;bottom:15%;width:min(60vw,290px)}
.blanket{position:absolute;left:0;top:0;width:min(44vw,210px);translate:-50% -50%;padding:0;border:0;background:none;cursor:pointer;z-index:4;
  transition:left .8s ease-in-out,top .8s ease-in-out}
.blanket.noanim{transition:none} .blanket.chair{z-index:2}
.blanket svg{transform-origin:50% 100%}
.blanket .chair-g{display:none} .blanket.chair .flat-g{display:none} .blanket.chair .chair-g{display:inline}
.blanket.morph svg{animation:morph .6s} .blanket.squash svg{animation:squash .5s}
@keyframes morph{30%{scale:1.3 .6}60%{scale:.8 1.3}100%{scale:1 1}}
@keyframes squash{40%{scale:1.25 .55}70%{scale:.9 1.15}}
.cover{position:absolute;left:0;top:0;width:min(52vw,250px);translate:-50% -50%;z-index:5;pointer-events:none}
.cover .chair-g{display:none}
.lamp{position:absolute;left:20%;bottom:18%;translate:-50% 0;width:min(18vw,80px);padding:0;border:0;background:none;cursor:pointer}
.lamp .glow{transition:opacity .4s} .lamp.off .glow{opacity:0} .lamp.off .shade{fill:#a88d55}
.room.dark::after{content:"";position:absolute;inset:0;background:rgb(8 12 36/.62);z-index:2;pointer-events:none;animation:fadein 1.2s}
.room.dark .window{z-index:3;box-shadow:0 0 30px rgb(245 231 161/.45)}
@keyframes fadein{from{opacity:0}}

.book{position:absolute;left:50%;bottom:5%;translate:-50% 0;width:min(84vw,340px);aspect-ratio:2/1.1;display:flex;gap:4px;padding:6px;border:0;
  background:var(--wood);border-radius:10px;cursor:pointer;perspective:800px;z-index:5}
.book .pg{flex:1;min-width:0;background:var(--paper);border-radius:6px;display:grid;place-items:center;padding:8px;color:#2a2620;
  font-family:var(--body);font-weight:800;font-size:clamp(12px,3.4vw,16px);line-height:1.3;text-align:center;text-wrap:balance}
.book .pg svg{width:82%}

<script>
const $=id=>document.getElementById(id);
const stage=$('stage'), threads=$('threads');
const rect=()=>stage.getBoundingClientRect();
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rand=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;
let soundOn=true, ac;

/* ================= звук ================= */
/* Речь идёт по очереди: фраза не обрывает другую. У каждого паука в очереди
   не больше одной ждущей фразы, а устаревшие (старше 3 с) пропускаются. */
const sq=[]; let speaking=false, spId=0, spTimer=0;
function speak(text,pitch=.4,rate=1,who='B',voiceIdx=0){
  if(!soundOn||!('speechSynthesis' in window)) return;
  for(let i=sq.length-1;i>=0;i--) if(sq[i].who===who) sq.splice(i,1);
  sq.push({text,pitch,rate,who,voiceIdx,t:performance.now()});
  if(!speaking) nextSpeech();
}
function nextSpeech(){
  clearTimeout(spTimer);
  let it; while((it=sq.shift())&&performance.now()-it.t>3000);
  if(!it){speaking=false;return}
  speaking=true; const id=++spId, done=()=>{if(id===spId)nextSpeech()};
  const u=new SpeechSynthesisUtterance(it.text);
  u.lang='ru-RU'; u.pitch=it.pitch; u.rate=it.rate;
  const ru=speechSynthesis.getVoices().filter(v=>/^ru/i.test(v.lang));
  if(ru.length) u.voice=ru[Math.min(it.voiceIdx,ru.length-1)];
  u.onend=done; u.onerror=done;
  spTimer=setTimeout(done,1200+it.text.length*120); // на случай, если onend не придёт
  speechSynthesis.resume();
  speechSynthesis.speak(u);
}
function stopSpeech(){sq.length=0;spId++;speaking=false;clearTimeout(spTimer);if('speechSynthesis' in window)speechSynthesis.cancel()}
/* iOS разрешает голос и звук только после настоящего касания (touchend/click).
   Тапы теперь ловятся через pointerdown, поэтому «разблокируем» речь отдельно. */
let unlocked=false;
function unlockAudio(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state!=='running') ac.resume()}catch(e){}
  if(unlocked||!('speechSynthesis' in window)) return;
  unlocked=true;
  const u=new SpeechSynthesisUtterance(' '); u.volume=0; u.lang='ru-RU';
  speechSynthesis.speak(u);
}
['touchend','click','keydown'].forEach(t=>addEventListener(t,unlockAudio,{capture:true}));
function tone(f,dur,type='triangle',delay=0,vol=.07,f2){
  if(!soundOn) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+delay;
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur+.05);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.06);
  }catch(e){}
}
const sfx={
  jump:()=>tone(180,.15,'square',0,.07,520),
  chomp:()=>{tone(300,.12,'sawtooth',0,.06,90);tone(280,.12,'sawtooth',.18,.06,80)},
  tick:n=>tone(520+n*70,.09,'sine',0,.08),
  yuck:()=>{tone(160,.35,'sawtooth',0,.07,70)},
  laugh:()=>[0,.14,.28,.42].forEach((d,i)=>tone(700-i*60,.09,'triangle',d,.07,500-i*60)),
  snore:()=>tone(90,.4,'sine',0,.08,60),
  fanfare:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',i*.1,.09));tone(1319,.5,'sine',.42,.06);tone(1568,.6,'sine',.55,.05)},
  whoosh:()=>tone(900,.3,'sine',0,.04,200),
  click:()=>tone(600,.05,'square',0,.05,300),
  flush:()=>{tone(700,1.1,'sine',0,.06,90);tone(400,1,'triangle',.1,.04,120)},
  water:()=>{for(let i=0;i<10;i++)tone(rand(900,1800),.05,'sine',i*.09,.025)},
  boing:()=>{tone(140,.25,'sine',0,.1,620);tone(620,.3,'sine',.25,.07,300)},
  magic:()=>[660,880,990,1320,1760].forEach((f,i)=>tone(f,.2,'sine',i*.07,.05)),
  page:()=>tone(1500,.12,'triangle',0,.03,500),
  door:()=>tone(220,.3,'sawtooth',0,.03,160),
  love:()=>[523,659,784].forEach((f,i)=>tone(f,.4,'sine',i*.12,.05)),
  lullaby:()=>[659,587,523,587,659,659,659].forEach((f,i)=>tone(f,.45,'sine',i*.42,.05)),
  poison:()=>{tone(1200,.25,'sawtooth',0,.03,300);[0,.18,.36].forEach((d,i)=>tone(260-i*40,.2,'sine',.25+d,.08,200-i*40))}
};
$('sound').addEventListener('click',()=>{
  soundOn=!soundOn; $('sound').setAttribute('aria-pressed',soundOn);
  $('sound').textContent=soundOn?'🔊 Звук':'🔇 Без звука';
  if(!soundOn) stopSpeech();
});

/* ================= конфетти ================= */
const fx=$('fx'), ctx=fx.getContext('2d'); let parts=[];
const CONF=['#d8432f','#7a3cc9','#e8a816','#4fae5a','#3d8fe0','#ff7ab0'];
function burst(x,y,n=60,power=9){
  for(let i=0;i<n;i++){const a=rand(0,TAU),p=rand(power*.3,power);
    parts.push({x,y,vx:Math.cos(a)*p,vy:Math.sin(a)*p-power*.5,r:rand(0,TAU),vr:rand(-.3,.3),w:rand(6,11),h:rand(4,7),c:pick(CONF),life:rand(60,110)})}
}
function drawFx(){
  const dpr=devicePixelRatio||1;
  if(fx.width!==innerWidth*dpr||fx.height!==innerHeight*dpr){fx.width=innerWidth*dpr;fx.height=innerHeight*dpr}
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life-->0);
  for(const p of parts){p.vy+=p.g??.25;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.min(1,p.life/30);
    ctx.fillStyle=p.c;
    if(p.heart){const s=p.w/20;ctx.beginPath();ctx.moveTo(0,6*s);ctx.bezierCurveTo(-14*s,-4*s,-6*s,-14*s,0,-6*s);
      ctx.bezierCurveTo(6*s,-14*s,14*s,-4*s,0,6*s);ctx.fill()}
    else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore()}

});

/* ================= игровой цикл ================= */
function update(s,h){
  s.anchor+=(s.anchorT-s.anchor)*.05;
  const o=home(s);
  if(!s.init){s.x=o.x;s.y=o.y;s.init=true}
  switch(s.state){
    case 'home': s.x=o.x; s.y=o.y; break;
    case 'enter': s.x=o.x; s.y+=(o.y-s.y)*.06;
      if(Math.abs(o.y-s.y)<1.5){s.y=o.y;s.state='home';s.onArrive&&s.onArrive()} break;
    case 'leave': s.x=o.x; s.y+=(-h*2-s.y)*.05; if(s.y<-h*1.3){destroy(s);return false} break;
    case 'tickle': {
      const tx=B.x+B.wrap.offsetWidth*.55, ty=B.y, dx=tx-s.x, dy=ty-s.y, d=Math.hypot(dx,dy);
      if(s.tickleOn){s.x=tx+Math.sin(performance.now()/40)*7;s.y=ty}
      else if(d<9) startTickle(s);
      else{const v=Math.min(7,d);s.x+=dx/d*v;s.y+=dy/d*v}
      break}
    case 'flee': s.x+=(o.x-s.x)*.12; s.y+=(-h*.2-s.y)*.12; break;
    case 'hunt': {
      const b=s.target;
      if(!b||b.dead){s.target=null;if(s.feast)feastNext(s);else s.state='return';break}
      const tx=b.x, ty=b.y-h*.22, dx=tx-s.x, dy=ty-s.y, d=Math.hypot(dx,dy);
      if(s===B){s.x+=dx*.2;s.y+=dy*.2;if(d<8)blackCatch(b)}
      else if(d<10&&!b.caught) rivalCatch(s,b);
      else if(d>1){const v=Math.min(s.feast?8:s.cfg.speed,d);s.x+=dx/d*v;s.y+=dy/d*v}
      break}
    case 'return': s.x+=(o.x-s.x)*.08; s.y+=(o.y-s.y)*.08;
      if(Math.hypot(o.x-s.x,o.y-s.y)<2){s.x=o.x;s.y=o.y;s.state='home';if(s===R)planRival()} break;
  }
  s.btn.classList.toggle('crawl',['hunt','return','enter','leave','flee','tickle'].includes(s.state));
  return true;
}
function frame(){
  const r=rect(), h=H(), now=performance.now();
  for(const b of bugs.filter(b=>b.K.poison&&!b.caught&&!b.dead)){
    const rem=b.fuse-now;
    b.el.style.setProperty('--p',Math.max(0,Math.min(1,rem/FUSE)));
    b.el.classList.toggle('hurry',rem<2000);
    if(rem<=0) explode(b);
  }
  for(const b of bugs){
    if(b.caught){b.el.style.transform=`translate(${b.x}px,${b.y}px)`;continue}
    b.t+=.02;
    b.a+=Math.sin(b.t*1.7+b.x*.01)*.05+(Math.random()-.5)*.08;
    const m=40, top=r.height*.32;
    if(b.x<m&&Math.cos(b.a)<0||b.x>r.width-m&&Math.cos(b.a)>0) b.a=Math.PI-b.a;
    if(b.y<top&&Math.sin(b.a)<0||b.y>r.height-m&&Math.sin(b.a)>0) b.a=-b.a;
    for(const s of spiders){
      const dx=b.x-s.x, dy=b.y-(s.y+h*.4), d=Math.hypot(dx,dy);
      if(d<h*.8) b.a+=(Math.atan2(dy,dx)-b.a)*.08;
    }
    const sp=b.K.speed*(level>=6?1.2:1);
    b.x+=Math.cos(b.a)*sp; b.y+=Math.sin(b.a)*sp;
    b.x=Math.min(Math.max(b.x,-30),r.width+30); b.y=Math.min(Math.max(b.y,20),r.height-20);
    const turn=b.k==='ladybug'||b.k==='stinkbug';
    b.el.style.transform=`translate(${b.x}px,${b.y}px) rotate(${turn?b.a*57.3+90:0}deg) scaleX(${turn?1:(Math.cos(b.a)<0?-1:1)})`;
  }
  for(const s of [...spiders]){
    if(!update(s,h)) continue;
    s.wrap.style.transform=`translate(${s.x-s.wrap.offsetWidth/2}px,${s.y-h*.35}px)`;
    s.line.setAttribute('x1',r.width*s.anchor);s.line.setAttribute('y1',-5);
    s.line.setAttribute('x2',s.x);s.line.setAttribute('y2',s.y);
    clampBubble(s,r.width);
  }
  drawFx();
  requestAnimationFrame(frame);
}

      if(t) p={x:t.x-s.x,y:t.y-(s.y+H()*.1)};

function clampDom(s){

    const kinds=[{k:'kitchen',say:'Это кухня! Тут вкусно, но спать нельзя.'},{k:'bath',say:'Это ванная! Я уже помылся.'},{k:'bed'}].sort(()=>Math.random()-.5);
    room.innerHTML=`<div class="wall"></div><div class="floor"></div>`+kinds.map((d,i)=>
      `<button class="door" data-k="${d.k}" style="left:${20+i*30}%" aria-label="Дверь"><span class="inside"></span><span class="panel"><i class="knob"></i></span><span class="sign">${SVG['sign_'+d.k]}</span></button>`).join('');
    S2=makeMain(); put(S2,standPos(.5,S2));
    setHint('Найди дверь, где нарисована луна');

  /* 5. Говорящее одеяло */
  blanket(alive){

  book(alive){

    setTimeout(()=>alive()&&talk2(S2,'Мама! Папа! Я иду спать!'),300);

      const pr=p.wrap.getBoundingClientRect(), st=rr(), side=key==='mom'?1:-1;

      talk2(p,line,2400); await wait(2000); if(!alive())return;

      lock=false; add2(1);

    const bind=(p,...a)=>{p.btn.addEventListener('pointerdown',e=>{e.preventDefault();hug(p,...a)});p.btn.addEventListener('click',e=>{if(e.detail===0)hug(p,...a)})};
    bind(mom,'mom','Спокойной ночи, сыночек! Люблю тебя!','И я тебя, мама!');

    setTimeout(()=>alive()&&talk2(S2,'Как хорошо в кроватке…'),300);

      add2(1,false);

  }
};

/* 2–4. Камни с примерами */
const NUM_WORDS=['Ноль','Один','Два','Три','Четыре','Пять','Шесть','Семь','Восемь','Девять','Десять','Одиннадцать','Двенадцать','Тринадцать','Четырнадцать','Пятнадцать','Шестнадцать','Семнадцать','Восемнадцать','Девятнадцать','Двадцать'];
function makeExample(mode,prev){
  for(let k=0;k<30;k++){
    let a,b,op='+';
    const R=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
    if(mode==='add10'){a=R(2,8);b=R(2,10-a);if(a+b<6)continue}            // сложение до 10
    else if(mode==='add20'){a=R(4,9);b=R(3,9);if(a+b<11)continue}         // сложение с переходом через десяток
    else{op='−';a=R(11,18);b=R(3,9);if(a-b>9)continue}                    // вычитание с переходом через десяток
    const ans=op==='+'?a+b:a-b;
    if(prev&&prev.a===a&&prev.b===b) continue;
    const opts=new Set([ans]);
    while(opts.size<3){const d=ans+pick([-2,-1,1,2]);if(d>=0&&d<=20)opts.add(d)}
    return{a,b,op,ans,opts:[...opts].sort(()=>Math.random()-.5)};
  }
}
function stonesScene(alive,mode,last){
  room.className='room sea';
  const N=EPX[l2].goal, xs=[9,24,39,54,69,85], ys=[47,57,47,57,47,55];
  room.innerHTML=SEA_BG+`<div class="boat far">${SVG.boat}</div>`+xs.map((x,i)=>
    `<div class="stone${i===N?(last?' land':' flag'):''}" id="r-st${i}" style="left:${x}%;top:${ys[i]}%"></div>`).join('')+
    `<div class="quiz"><div class="ex" id="r-ex" aria-live="polite"></div><div class="dots" id="r-dots" aria-hidden="true"></div><div class="ans" id="r-ans"></div></div>`;
  S2=makeMain('small'); put(S2,onStone($('r-st0')));
  setHint(last?'Реши пример, и паук прыгнет. Берег уже близко!':'Реши пример, и паук прыгнет на следующий камень');
  let ex=null, lock=false;
  function ask(){
    ex=makeExample(mode,ex); lock=false;
    $('r-ex').textContent=`${ex.a} ${ex.op} ${ex.b} = ?`;
    $('r-dots').innerHTML=ex.op==='+'
      ? '<i></i>'.repeat(ex.a)+'<i class="gap"></i>'+'<i class="b"></i>'.repeat(ex.b)
      : '<i></i>'.repeat(ex.a-ex.b)+'<i class="x"></i>'.repeat(ex.b);
    $('r-ans').innerHTML=ex.opts.map(o=>`<button data-v="${o}">${o}</button>`).join('');
    $('r-ans').querySelectorAll('button').forEach(btn=>btn.onclick=()=>answer(btn));
    talk2(S2,`Сколько будет ${ex.a} ${ex.op==='+'?'плюс':'минус'} ${ex.b}?`,2600);
  }
  async function answer(btn){
    if(lock||busy2) return;
    if(+btn.dataset.v!==ex.ans){
      btn.classList.add('no'); btn.disabled=true; sfx.yuck(); restart(S2.btn,'shake');
      const r=S2.wrap.getBoundingClientRect(), st=rr(); splash2({x:r.left-st.left+r.width/2,y:r.top-st.top+r.height});
      talk2(S2,pick(['Ой! Чуть не упал! Подумай ещё.','Нет, не так! Посчитай кружочки.','Ой-ой! Попробуй ещё раз.']));
      return;
    }
    lock=true; btn.classList.add('ok'); $('r-ex').textContent=`${ex.a} ${ex.op} ${ex.b} = ${ex.ans}`;
    sfx.jump(); restart(S2.btn,'jump'); put(S2,onStone($('r-st'+(p2+1))));
    talk2(S2,`${NUM_WORDS[ex.ans]}! Правильно!`); add2(1,false);
    await wait(1000); if(!alive())return;
    if(p2>=N){$('r-ans').innerHTML='';$('r-dots').innerHTML='';celebrate2();return}
    await wait(500); if(!alive())return;
    ask();
  }
  setTimeout(()=>alive()&&ask(),500);
}
