y}\" r=\"${10*s}\" fill=\"${LADY_COLORS[v.color].hex}\"/><path d=\"M${x} ${y-10*s} V${y+10*s}\" stroke=\"#222\" stroke-width=\"${1.2*s}\"/>`+\n      spots.map(([a,b])=>`<circle cx=\"${x+a*s}\" cy=\"${y+b*s}\" r=\"${1.7*s}\" fill=\"#222\"/>`).join(''))},\n  instr:(x,y,s,kind)=>kind==='pipe'?`<path d=\"M${x+14*s} ${y-4*s} L${x+40*s} ${y+10*s}\" stroke=\"#b5803a\" stroke-width=\"${3.4*s}\" stroke-linecap=\"round\"/>${[0,1,2].map(i=>`<circle cx=\"${x+(22+i*5)*s}\" cy=\"${y+(0.3+i*2.7)*s}\" r=\"${.8*s}\" fill=\"#5a3416\"/>`).join('')}`\n    : kind==='drum'?`<path d=\"M${x+20*s} ${y+2*s} v${8*s} a${10*s} ${3.5*s} 0 0 0 ${20*s} 0 v-${8*s}\" fill=\"#d8402c\" stroke=\"#5a3416\" stroke-width=\"${.8*s}\"/><ellipse cx=\"${x+30*s}\" cy=\"${y+2*s}\" rx=\"${10*s}\" ry=\"${3.5*s}\" fill=\"#f3ead6\" stroke=\"#5a3416\" stroke-width=\"${.8*s}\"/><path d=\"M${x+20*s} ${y-12*s} l${6*s} ${12*s} M${x+40*s} ${y-12*s} l-${5*s} ${12*s}\" stroke=\"#5a3416\" stroke-width=\"${1.2*s}\" stroke-linecap=\"round\"/>`\n    : kind==='guitar'?`<g transform=\"rotate(-35 ${x+28*s} ${y+6*s})\"><circle cx=\"${x+28*s}\" cy=\"${y+10*s}\" r=\"${6*s}\" fill=\"#e08a2e\"/><circle cx=\"${x+28*s}\" cy=\"${y+3*s}\" r=\"${4.5*s}\" fill=\"#e08a2e\"/><circle cx=\"${x+28*s}\" cy=\"${y+8*s}\" r=\"${1.6*s}\" fill=\"#5a3416\"/><rect x=\"${x+27*s}\" y=\"${y-14*s}\" width=\"${2*s}\" height=\"${15*s}\" fill=\"#5a3416\"/><\/g>`\n    : `<g transform=\"rotate(-30 ${x+26*s} ${y+2*s})\"><ellipse cx=\"${x+26*s}\" cy=\"${y+4*s}\" rx=\"${5*s}\" ry=\"${7*s}\" fill=\"#b5652a\"/><rect x=\"${x+25*s}\" y=\"${y-10*s}\" width=\"${2*s}\" height=\"${9*s}\" fill=\"#5a3416\"/><\/g><path d=\"M${x+16*s} ${y-2*s} L${x+38*s} ${y+10*s}\" stroke=\"#5a3416\" stroke-width=\"${1*s}\"/>`,\n  hopper:(x,y,s=1,withInstr,v=V5)=>tap('hopper',`<path d=\"M${x-14*s} ${y+6*s} L${x+4*s} ${y-16*s} L${x+8*s} ${y+8*s}\" stroke=\"#3f8f2e\" stroke-width=\"${3*s}\" fill=\"none\" stroke-linejoin=\"round\"/><ellipse cx=\"${x}\" cy=\"${y}\" rx=\"${18*s}\" ry=\"${6*s}\" fill=\"#7bc94a\" transform=\"rotate(-18 ${x} ${y})\"/>\n    <circle cx=\"${x+18*s}\" cy=\"${y-8*s}\" r=\"${6*s}\" fill=\"#7bc94a\"/><circle cx=\"${x+20*s}\" cy=\"${y-9*s}\" r=\"${2*s}\" fill=\"#fff\"/><circle cx=\"${x+20.6*s}\" cy=\"${y-9*s}\" r=\"${1*s}\" fill=\"#222\"/><path d=\"M${x+16*s} ${y-13*s} q-6 -14 -16 -16 M${x+19*s} ${y-13*s} q2 -14 10 -18\" stroke=\"#3f8f2e\" stroke-width=\"${1*s}\" fill=\"none\"/>\n    <path d=\"M${x+2*s} ${y+4*s} l-3 ${10*s} M${x+10*s} ${y+2*s} l1 ${11*s}\" stroke=\"#3f8f2e\" stroke-width=\"${1.6*s}\"/>`+(withInstr?R5.instr(x,y,s,v.instr):'')),\n  berries:(x,y,s=1,v=V5)=>{const pos=[[-6,0],[6,0],[0,-8],[12,-8],[-12,-8]].slice(0,v.berries), c=BERRY[v.berry].hex;\n    return tap('berries',pos.map(([a,b])=>`<circle cx=\"${x+a*s}\" cy=\"${y+b*s}\" r=\"${5*s}\" fill=\"${c}\"/><circle cx=\"${x+a*s-1.5*s}\" cy=\"${y+b*s-1.5*s}\" r=\"${1.2*s}\" fill=\"#fff\" opacity=\".7\"/>`).join('')+`<path d=\"M${x} ${y-13*s} q3 -4 7 -3\" stroke=\"#4fae5a\" stroke-width=\"${1.6*s}\" fill=\"none\"/>`)},\n  notes:(x,y)=>tap('notes',`<g fill=\"#2a2620\" font-family=\"sans-serif\" font-size=\"12\"><text x=\"${x}\" y=\"${y}\">♪<\/text><text x=\"${x+12}\" y=\"${y-8}\">♫<\/text><text x=\"${x+24}\" y=\"${y+2}\">♪<\/text><\/g>`),\n  wind:()=>tap('wind',`<path d=\"M8 36 q30 -12 54 0 q10 5 4 10 q-6 4 -9 -2 M90 56 q34 -10 60 2 q10 5 4 10 q-6 3 -8 -3\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" opacity=\".9\"/>`),\n  sp:(x,y,s=.5)=>T.sp(x,y,s), web:(x,y,r)=>T.web(x,y,r).replace('#cfd6e8','#ffffff'), thread:(x,y1,y2)=>T.thread(x,y1,y2).replace('#e8ecf5','#ffffff')\n};\n\n/* ---- что в этот раз будет в книжке: всё выбирается случайно ---- */\nconst LADY_COLORS={red:{hex:'#e23b2e',nom:'red',ans:'Red'},orange:{hex:'#f08a24',nom:'orange',ans:'Orange'},yellow:{hex:'#f2c230',nom:'yellow',ans:'Yellow'}};\nconst BERRY={rasp:{hex:'#d63a5a',gen:'raspberries',acc:'raspberries',ans:'Raspberries'},straw:{hex:'#e8343a',gen:'strawberries',acc:'strawberries',ans:'Strawberries'},blue:{hex:'#3d3f8f',gen:'blueberries',acc:'blueberries',ans:'Blueberries'}};\nconst TREES={maple:{loc:'maple',ans:'In a maple'},oak:{loc:'oak',ans:'In an oak'},birch:{loc:'birch',ans:'In a birch'}};\nconst INSTR={violin:{ins:'with a little violin',on:'on the violin',ans:'On the violin'},pipe:{ins:'with a little pipe',on:'on the pipe',ans:'On the pipe'},drum:{ins:'with a drum',on:'on the drum',ans:'On the drum'},guitar:{ins:'with a guitar',on:'on the guitar',ans:'On the guitar'}};\nconst NUMF=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve']; // женский род: ягодки, точки\nconst NUMQ=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];\nconst cap=w=>w[0].toUpperCase()+w.slice(1);\nconst plural=(n,one,few,many)=>{if(LANG==='en') return n===1?one:many; const a=n%10,b=n%100;return a===1&&b!==11?one:a>=2&&a<=4&&(b<12||b>14)?few:many};\nfunction newV5(){\n  const rnd=a=>a[Math.floor(Math.random()*a.length)];\n  return {snail:rnd(['Tilly','Sally','Nelly']),lady:rnd(['Mila','Nika','Tess']),hopper:rnd(['George','Kenny','Tommy']),\n    tree:rnd(Object.keys(TREES)),berry:rnd(Object.keys(BERRY)),berries:2+Math.floor(Math.random()*4),\n    color:rnd(Object.keys(LADY_COLORS)),spots:2+Math.floor(Math.random()*6),instr:rnd(Object.keys(INSTR)),\n    shelter:rnd(['leaf','mushroom']),rainbow:5+Math.floor(Math.random()*3),n:9+Math.floor(Math.random()*4)};\n}\nlet V5=newV5(), BOOK5=[], QUIZ5=[];\nconst V5KEY=LANG==='en'?'spider-ep5-v-en':'spider-ep5-v';   // имена героев на своём языке\nfunction ensureV5(fresh){\n  let v=null; if(!fresh){try{v=JSON.parse(localStorage.getItem(V5KEY))}catch(e){}}\n  V5=v&&v.snail?v:newV5(); try{localStorage.setItem(V5KEY,JSON.stringify(V5))}catch(e){}\n  BOOK5=makeBook5(V5); QUIZ5=makeQuiz5(V5);\n}\nfunction makeBook5(v){\n  const sh=v.shelter==='leaf', shelter=(x,y,s,t)=>sh?R5.leaf(x,y,s,t):R5.mushroom(x,y,s,t);\n  const shWhere=sh?'under a big tRect();\n    b.style.translate=`${sr.left+sr.width/2-br.left-br.width/2}px ${sr.top+sr.height*.35-br.top-br.height/2}px`; b.style.scale='.5'; sfx.whoosh();\n    await wait(650); if(!alive())return;\n    S2.wrap.classList.add('w-'+k); restart(S2.btn,'jump'); sfx.magic(); talk2(S2,lines[k]); add2(1,false);\n    if(p2>=3){await wait(1500); if(!alive())return; talk2(C,'Great! Let\\'s run to the pool!'); await wait(1300); if(alive()) celebrate2()}\n  });\n};\n\n/* Сердечки: сколько раз можно врезаться. После неудачной попытки в следующий раз даётся на одно больше (до пяти) */\nconst fails6={};\nfunction livesFor(key){return 3+Math.min(2,fails6[key]||0)}\n// Сердечки в углу. st.sc — сколько звёздочек собрано: каждая вторая даёт сердечко (всего до шести),\n// а после первой следующее сердечко уже заполнено наполовину\nfunction heartPath(g,x,y,s){g.beginPath(); g.moveTo(x,y+s*.9); g.bezierCurveTo(x-s*1.6,y-s*.2,x-s*.7,y-s*1.3,x,y-s*.45); g.bezierCurveTo(x+s*.7,y-s*1.3,x+s*1.6,y-s*.2,x,y+s*.9)}\nconst heartSlot=(W,i)=>({x:14+W*.032+i*W*.032*2.3,y:W*.06});\nfunction drawHearts(g,W,lives,max,st){\n  const s=W*.032, half=st&&st.sc%2===1&&lives<6, slots=Math.max(max,lives+(half?1:0));\n  for(let i=0;i<slots;i++){\n    const {x,y}=heartSlot(W,i), pulse=st&&st.pulse>0&&i===lives-1?1+Math.sin(st.pulse/.4*Math.PI)*.45:1, q=s*pulse;\n    heartPath(g,x,y,q); g.fillStyle='rgb(255 255 255/.55)'; g.fill();\n    if(i<lives){heartPath(g,x,y,q); g.fillStyle='#e8436f'; g.fill()}\n    else if(i===lives&&half){ g.save(); g.beginPath(); g.rect(x-s*2,y,s*4,s*2); g.clip(); heartPath(g,x,y,s); g.fillStyle='#f39ab4'; g.fill(); g.restore() }\n    heartPath(g,x,y,q); g.strokeStyle='rgb(0 0 0/.25)'; g.lineWidth=1.5; g.stroke();\n  }\n}\nfunction starHeart(st,x,y){\n  st.sc=(st.sc||0)+1; st.fly=st.fly||[];\n  if(st.sc%2===0&&st.lives+st.fly.length<6) st.fly.push({x0:x,y0:y,k:0});\n}\n// сердечко летит от места звёздочки в ряд в углу и только там добавляется\nfunction flyHearts(g,st,W,dt){\n  st.pulse=Math.max(0,(st.pulse||0)-dt);\n  if(!st.fly||!st.fly.length) return;\n  for(const f of st.fly){\n    f.k=Math.min(1,f.k+dt/.7); const t=f.k, e=1-(1-t)*(1-t), to=heartSlot(W,st.lives);\n    const x=f.x0+(to.x-f.x0)*e, y=f.y0+(to.y-f.y0)*e-Math.sin(t*Math.PI)*W*.12, s=W*.032*(1.6-.6*t);\n    heartPath(g,x,y,s); g.fillStyle='#e8436f'; g.fill(); g.strokeStyle='#fff'; g.lineWidth=2; g.stroke();\n    if(f.k>=1&&!f.done){ f.done=true; st.lives=Math.min(6,st.lives+1); st.maxH=Math.max(st.maxH||0,st.lives); st.pulse=.4; sfx.love() }\n  }\n  st.fly=st.fly.filter(f=>!f.done);\n}\nfunction hitSay(t,lives){ // облачко про оставшиеся сердечки\n  say(t,lives>0?`<b>Ouch!<\/b> ${lives===1?'Only one heart left!':`${lives} hearts left`}`:'<b>Uh-oh!<\/b>',1300)}\nfunction failStage(st,stars0){\n  // слишком много столкновений: попытка заканчивается, этап можно начать заново\n  st.done=true; st.failed=true; stars6=stars0; const key=EPX[l2].key; fails6[key]=(fails6[key]||0)+1;\n  S2.btn.classList.remove('crawl'); restart(S2.btn,'sad'); sfx.yuck();\n  setTimeout(()=>{ if(!st.failed||S2==null) return;\n    talk2(S2,`Too many bumps… Never mind! Let's start again, and you'll have ${livesFor(key)} hearts!`,3000);\n    setHint('Out of hearts. Tap to start this stage again');\n    const z=$('r-tz'); if(z){z.textContent='Tap to start again'; z.style.opacity=1}\n    st.canRetry=true },700);\n}\n\n/* Общий движок для пробежки и заплыва: мир едет влево, паук на месте, нажатие = прыжок или гребок */\nfunction arcade(alive,cfg){\n  room.className='room'; room.innerHTML=`<canvas class=\"cv\" id=\"r-cv\"><\/canvas><div class=\"tapzone\" id=\"r-tz\">${cfg.tapHint}<\/div>`;\n  const cv=$('r-cv'), g=cv.getContext('2d');\n  S2=makeMain('small free'); wearAll(S2,cfg.gear);\n  const LIVES=livesFor(EPX[l2].key), stars0=stars6;\n  const st={lives:LIVES,W:0,H:0,dist:0,obs:[],nextAt:0,y:0,vy:0,air:0,inv:0,slow:0,hits:0,last:performance.now(),done:false,t:0,lastOuch:0,tapped:false};\n  function size(){const r=rr(),dpr=Math.min(2,devicePixelRatio||1); st.W=r.width; st.H=r.height; st.sw=S2.wrap.offsetWidth; st.ox=r.left; st.oy=r.top;\n    cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); g.setTransform(dpr,0,0,dpr,0,0)}\n  size(); cfg.init(st);\n  let resized=false; const ro=new ResizeObserver(()=>{resized=true}); ro.observe(room);\n  const L=cfg.length(st);\n  handlers2={move(){},down(e){e.preventDefault&&e.preventDefault(); if(st.failed){ if(st.canRetry){st.canRetry=false;enter2(l2)} return }\n    if((st.done&&!st.waitJump)||busy2) return; if(!st.tapped){st.tapped=true;$('r-tz').style.opacity=0} cfg.tap(st)}};\n  const sr=()=>st.sw*.3; // радиус паука для столкновений\n  function hitRect(cx,cy,r,x,y,w,h){const nx=Math.max(x,Math.min(cx,x+w)),ny=Math.max(y,Math.min(cy,y+h));return (cx-nx)**2+(cy-ny)**2<r*r}\n  function ouch(){\n    st.inv=1.3; st.slow=.7; st.hits++; st.lives--; S2.wrap.classList.add('blink'); restart(S2.btn,'shake'); sfx.yuck();\n    if(st.lives<=0){ S2.wrap.classList.remove('blink'); failStage(st,stars0); return }\n    hitSay(S2,st.lives);   // только облачко, без голоса: запуск речи на телефоне подтормаживает игру\n  }\n  function star(x,y,r){g.save();g.translate(x,y);g.rotate(st.t*1.5);g.beginPath();for(let i=0;i<10;i++){const q=i%2?r*.45:r,a=-Math.PI/2+i*Math.PI/5;g.lineTo(Math.cos(a)*q,Math.sin(a)*q)}g.closePath();g.fillStyle='#ffd23a';g.fill();g.strokeStyle='#e0a412';g.lineWidth=1.5;g.stroke();g.restore()}\n  (function frame(){\n    if(!alive()){ro.disconnect();return}\n    const now=performance.now(), dt=Math.min(.05,(now-st.last)/1000); st.last=now; st.t+=dt;\n    if(resized){resized=false;size()}\n    const W=st.W,H=st.H, sx=W*.24;\n    if(!st.done&&st.tapped){\n      const v=cfg.speed(st)*(st.slow>0?.45:1); st.dist+=v*dt;\n      st.slow=Math.max(0,st.slow-dt); st.inv=Math.max(0,st.inv-dt); if(st.inv<=0) S2.wrap.classList.remove('blink');\n      while(st.nextAt<st.dist+W*1.2&&st.nextAt<L-W*.6){cfg.spawn(st,st.nextAt+W); st.nextAt+=cfg.gap(st)}\n    }\n    cfg.physics(st,dt);\n    const prog=Math.min(1,st.dist/L), want=Math.floor(prog*EPX[l2].goal);\n    if(want>p2&&!st.done){p2=want;render2()}\n    // мир\n    cfg.drawBg(g,st,L);\n    const r=sr();\n    for(const o of st.obs){\n      o.sx=o.x-st.dist; if(o.sx<-W*.3||o.sx>W*1.3){if(o.sx<-W*.3)o.gone=true; continue}\n      cfg.drawObs(g,o,st);\n      if(o.star){ if(!o.got&&Math.hypot(o.sx-sx,o.sy-st.y)<r+W*.035){o.got=true;stars6++;starHeart(st,o.sx,o.sy);tone(1400,.08,'sine',0,.06);tone(1900,.12,'sine',.07,.05);burst(st.ox+o.sx,st.oy+o.sy,10,4)}\n        else if(!o.got) star(o.sx,o.sy,W*.032); continue }\n      if(st.inv<=0&&!st.done&&cfg.hits(o,st,sx,r,hitRect)) ouch();\n    }\n    st.obs=st.obs.filter(o=>!o.gone);\n    g.font=`800 ${Math.round(W*.045)}px Nunito,system-ui,sans-serif`; g.fillStyle='#fff'; g.strokeStyle='rgb(0 0 0/.35)'; g.lineWidth=3; g.textAlign='right';\n    g.strokeText(`⭐ ${stars6}`,W-12,W*.07); g.fillText(`⭐ ${stars6}`,W-12,W*.07); flyHearts(g,st,W,dt); drawHearts(g,W,st.lives,Math.max(LIVES,st.maxH||0),st);\n    // паук двигается через transform: это не пересчитывает раскладку страницы\n    S2.wrap.style.transform=`translate(${sx+(st.xoff||0)-st.sw/2}px,${st.y-st.sw*.425}px)`; S2.btn.style.rotate=(cfg.tilt?cfg.tilt(st,dt):0)+'deg';\n    if(!st.done&&st.dist>=L){st.done=true; fails6[EPX[l2].key]=0; p2=EPX[l2].goal; render2(); cfg.finish(st)}\n    requestAnimationFrame(frame);\n  })();\n  return st;\n}\n\n/* 2. Пробежка к бассейну: прыжки через препятствия, как в Geometry Dash */\nlet cfg_run=null;\nSCENES.run=function(alive){\n  setHint(`Tap to jump, tap again in the air to go higher! You have ${livesFor('run')} hearts, and every 2 stars give you another one`);\n  setTimeout(()=>alive()&&!st.tapped&&talk2(S2,'If you tap twice, I\\'ll jump higher!',2600),500);\n  const ground=st=>st.H*.8;\n  cfg_run={dive:async st=>{\n    splash2({x:st.W*.24+st.xoff,y:ground(st)+st.H*.06}); sfx.water(); S2.wrap.classList.add('vanish');\n
