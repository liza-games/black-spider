<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Чёрный паук</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one-screen game — сверху карточка этапа (точки, задание, прогресс), сцена с пауками и букашками, снизу кнопки */
:root{
  --bg:#eef0e9; --web:#c7cbbd; --fg:#1b1c18; --muted:#6b6f62;
  --bubble:#ffffff; --accent:#d8432f; --spider:#141412; --violet:#7a3cc9; --red:#d6332b; --blue:#2350c8; --green:#2f9e44; --gold:#e8a816;
  --wing:rgb(160 190 215/.7); --track:rgb(27 28 24/.1); --poison:#2f6fe0;
  --display:"Rubik Mono One","Arial Black",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17181c; --web:#34363d; --fg:#ecebe6; --muted:#8e9099; --bubble:#2a2c33; --accent:#ff6a52;
  --spider:#050506; --violet:#9b5cf0; --red:#ff4d43; --blue:#4d7dff; --green:#4cc764; --gold:#f5c03a; --wing:rgb(190 215 240/.55); --track:rgb(236 235 230/.12); --poison:#5a95ff; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#17181c; --web:#34363d; --fg:#ecebe6; --muted:#8e9099; --bubble:#2a2c33; --accent:#ff6a52;
  --spider:#050506; --violet:#9b5cf0; --red:#ff4d43; --blue:#4d7dff; --green:#4cc764; --gold:#f5c03a; --wing:rgb(190 215 240/.55); --track:rgb(236 235 230/.12); --poison:#5a95ff; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;
  display:flex;flex-direction:column;align-items:center;padding:0 16px;box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#web{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#web path,#web line{stroke:var(--web);fill:none;stroke-width:1.5}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}

/* ---- карточка этапа ---- */
.hud{position:relative;z-index:5;padding-block:14px 4px;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.hud.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.85);opacity:.3}100%{transform:scale(1);opacity:1}}
.steps{display:flex;gap:6px}
.steps i{width:10px;height:10px;border-radius:50%;background:var(--track);transition:background .3s,transform .3s}
.steps i.done{background:var(--gold)}
.steps i.now{background:var(--accent);transform:scale(1.35)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(18px,5.2vw,28px);line-height:1.15;margin:0;text-wrap:balance}
.hint{color:var(--muted);margin:0;font-size:15px;font-weight:600;line-height:1.3;min-height:2.6em;text-wrap:balance}
.bars{width:100%;max-width:280px;display:flex;flex-direction:column;gap:4px;margin-top:2px}
.bar{height:12px;border-radius:999px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:var(--accent);transition:width .35s cubic-bezier(.3,1.4,.5,1)}
.bar.rival{height:8px}.bar.rival i{background:var(--red)}
.count{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.count b{font-family:var(--display);font-weight:400;color:var(--accent)}
.count em{font-style:normal;font-family:var(--display);color:var(--red)}
#replay{font:inherit;font-family:var(--display);font-size:16px;color:#fff;background:var(--accent);border:0;border-radius:999px;padding:12px 22px;cursor:pointer;margin-top:4px}

/* ---- сцена ---- */
.stage{position:relative;flex:1;width:100%;max-width:680px;overflow:hidden;touch-action:none}
#threads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#threads line{stroke:var(--muted);stroke-width:2}
#banner{position:absolute;left:50%;top:42%;translate:-50% -50%;z-index:8;pointer-events:none;
  font-family:var(--display);font-size:clamp(30px,10vw,56px);color:var(--gold);white-space:nowrap;
  text-shadow:0 3px 0 var(--accent),0 8px 24px rgb(0 0 0/.25);opacity:0}
#banner.show{animation:banner 1.7s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes banner{0%{opacity:0;scale:.3 .3;rotate:-8deg}18%{opacity:1;scale:1.1 1.1;rotate:3deg}30%{scale:1 1;rotate:0deg}80%{opacity:1}100%{opacity:0;scale:1.15 1.15}}

.sw{position:absolute;left:0;top:0;width:min(34vw,170px);z-index:3;will-change:transform}
.sw.purple{--spider:var(--violet);z-index:4}
.sw.red{--spider:var(--red);z-index:4}
.sw.blue{--spider:var(--blue);z-index:4}
.sw.green{--spider:var(--green);z-index:4}
.green .bubble b{color:var(--green)}
.tickled .sp{animation:laugh .16s infinite}
.tickled .legs-l{animation:wigL .16s infinite}.tickled .legs-r{animation:wigR .16s infinite}
.sw.yuck{--spider:#5f8f2e}
.sp{display:block;width:100%;background:none;border:0;padding:0;cursor:pointer;transform-origin:50% 0}
.sp:focus-visible{outline:3px dashed var(--accent);outline-offset:6px;border-radius:50%}
.sp svg{width:100%;height:auto;display:block;overflow:visible}
.body{fill:var(--spider);transition:fill .3s}
.leg{fill:none;stroke:var(--spider);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.eye{fill:#fff}.pupil{fill:#111}
.lids{display:none;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round}
.brow{stroke:#111;stroke-width:3;stroke-linecap:round;display:none}
.purple .brow,.red .brow{display:inline}
.legs-l,.legs-r{transform-origin:100px 100px}
.asleep .eye,.asleep .pupil{display:none}
.asleep .lids{display:inline}
.asleep .sp{animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{rotate:-4deg}50%{rotate:4deg}}
.zzz{position:absolute;left:62%;top:10%;display:none;font-family:var(--display);color:var(--muted);pointer-events:none}
.asleep .zzz{display:block}
.zzz span{position:absolute;opacity:0;animation:zz 3s infinite}
.zzz span:nth-child(2){animation-delay:1s;font-size:1.3em}
.zzz span:nth-child(3){animation-delay:2s;font-size:1.7em}
@keyframes zz{0%{opacity:0;translate:0 0}20%{opacity:1}100%{opacity:0;translate:30px -60px}}
.ring{position:absolute;left:50%;top:50.6%;width:150%;aspect-ratio:1;translate:-50% -50%;border:3px dashed var(--accent);border-radius:50%;
  opacity:.5;display:none;pointer-events:none;animation:spin 4s linear infinite}
.ring::after{content:"";position:absolute;top:-11px;left:50%;border:9px solid transparent;border-left:14px solid var(--accent);border-right:0}
.eyes .ring{display:block}

.jump{animation:jump .7s cubic-bezier(.2,.8,.3,1)}
.jump .legs-l{animation:wigL .7s}.jump .legs-r{animation:wigR .7s}
.crawl .legs-l{animation:wigL .25s infinite}.crawl .legs-r{animation:wigR .25s infinite}
.chomp{animation:chomp .18s 4}
.stir{animation:stir .5s}
.laugh{animation:laugh .16s 8}
.laugh .legs-l{animation:wigL .16s 8}.laugh .legs-r{animation:wigR .16s 8}
.sad{animation:sad .9s}
.shake{animation:shake .1s 6}
@keyframes jump{0%{translate:0 0;scale:1 1}12%{translate:0 10px;scale:1.12 .86}
  45%{translate:0 -90px;scale:.92 1.1}70%{translate:0 0;scale:1.08 .92}85%{scale:.97 1.03}100%{translate:0 0;scale:1 1}}
@keyframes wigL{0%,100%{rotate:0deg}50%{rotate:-14deg}}
@keyframes wigR{0%,100%{rotate:0deg}50%{rotate:14deg}}
@keyframes chomp{50%{scale:1.08 .9}}
@keyframes stir{25%{rotate:-10deg}75%{rotate:10deg}}
@keyframes laugh{0%,100%{translate:0 0;rotate:0deg}25%{translate:0 -8px;rotate:-6deg}75%{translate:0 -8px;rotate:6deg}}
@keyframes sad{30%{translate:0 8px;scale:1.05 .92}100%{translate:0 0}}
@keyframes shake{25%{translate:-6px 0}75%{translate:6px 0}}

.bubble{position:absolute;bottom:calc(100% - 16px);left:55%;transform:scale(.4);transform-origin:0 100%;opacity:0;
  background:var(--bubble);color:var(--fg);font-family:var(--display);font-size:clamp(12px,3.6vw,17px);
  padding:10px 14px;border-radius:18px;width:max-content;max-width:min(230px,62vw);line-height:1.25;text-wrap:balance;box-shadow:0 6px 20px rgb(0 0 0/.15);
  transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;pointer-events:none;z-index:6}
.bubble::after{content:"";position:absolute;left:16px;bottom:-10px;border:10px solid transparent;border-top-color:var(--bubble);border-bottom:0}
.bubble.show{opacity:1;transform:scale(1)}
.bubble.flip{left:auto;right:55%;transform-origin:100% 100%}
.bubble.flip::after{left:auto;right:16px}
.bubble b{color:var(--accent);font-weight:400}
.purple .bubble b{color:var(--violet)} .red .bubble b{color:var(--red)} .blue .bubble b{color:var(--blue)}
.purple .brow,.red .brow,.blue .brow{display:inline}

.bug{position:absolute;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;padding:0;border:0;background:none;
  cursor:pointer;z-index:2;will-change:transform}
.bug:focus-visible{outline:2px dashed var(--accent);border-radius:50%}
.bug svg{width:100%;height:100%;overflow:visible;transition:scale .2s}
.bug.caught svg{animation:wiggle .12s infinite}
.bug.gone svg{scale:0}
.bug.hunted::before{content:"";position:absolute;inset:2px;border:2px dashed var(--hc,var(--violet));border-radius:50%;opacity:.8;animation:spin 2s linear infinite}
.flap{animation:flap .08s infinite alternate;transform-box:fill-box}
.flapL{transform-origin:right center}.flapR{transform-origin:left center}
.slow{animation-duration:.22s}
.stink{animation:stink 1.4s ease-in-out infinite}
.bug.poison::after{content:"";position:absolute;inset:-4px;border-radius:50%;pointer-events:none;
  background:conic-gradient(var(--poison) calc(var(--p,1)*360deg),var(--track) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px))}
.bug.poison.caught::after{display:none}
.bug.hurry svg{animation:hurry .3s infinite}
@keyframes hurry{50%{scale:1.15 1.15}}
.cloud{position:absolute;left:0;top:0;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;pointer-events:none;z-index:7;
  background:radial-gradient(circle,rgb(70 120 230/.6),rgb(120 100 230/.25) 45%,transparent 70%);animation:cloud 1.4s ease-out forwards}
@keyframes cloud{0%{scale:.2 .2;opacity:1}100%{scale:2.2 2.2;opacity:0}}
.sw.poisoned{--spider:#2f5fb8}
.poisoned .sp{animation:dizzy .7s ease-in-out infinite}
@keyframes dizzy{0%,100%{rotate:-9deg}50%{rotate:9deg}}
@keyframes flap{to{scale:.25 1}}
@keyframes wiggle{50%{rotate:12deg}}
@keyframes spin{to{rotate:360deg}}
@keyframes stink{0%,100%{opacity:.2;translate:0 2px}50%{opacity:.9;translate:0 -3px}}

footer{position:relative;z-index:5;padding-block:8px 18px;display:flex;gap:10px;align-items:center;justify-content:center}
footer button{font:inherit;font-weight:800;font-size:14px;color:var(--fg);background:var(--bubble);border:1.5px solid var(--web);
  border-radius:999px;padding:8px 14px;cursor:pointer}
footer button:focus-visible,#replay:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.jump,.chomp,.flap,.laugh,.sad,.stir,.shake,.ring,.zzz span{animation-duration:.01s}}

/* ================= эпизод 2: комнаты ================= */
:root{ --wall:#e4e9e0; --wallbed:#e6e0ef; --dot:rgb(122 60 201/.12); --floor:#d6c7ad; --tile:#cfe2e8; --grout:rgb(255 255 255/.65);
  --porcelain:#ffffff; --line:rgb(27 28 24/.18); --wood:#a8794f; --wood2:#c99a6b; --water:#4ea3e6; --sheet:#f7f4ee;
  --blanket:#e9a23b; --blanket2:#d18a26; --night:#1d2550; --paper:#fbf6ea }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --wall:#252830; --wallbed:#28243a; --dot:rgb(155 92 240/.14);
  --floor:#3b342c; --tile:#22343b; --grout:rgb(255 255 255/.07); --porcelain:#e6eaee; --line:rgb(0 0 0/.35); --wood:#8a6040; --wood2:#a8794f;
  --water:#4d9be0; --sheet:#d9dce2; --blanket:#d8912e; --blanket2:#b97821; --night:#0c1030; --paper:#efe7d4 }}
:root[data-theme="dark"]{ --wall:#252830; --wallbed:#28243a; --dot:rgb(155 92 240/.14);
  --floor:#3b342c; --tile:#22343b; --grout:rgb(255 255 255/.07); --porcelain:#e6eaee; --line:rgb(0 0 0/.35); --wood:#8a6040; --wood2:#a8794f;
  --water:#4d9be0; --sheet:#d9dce2; --blanket:#d8912e; --blanket2:#b97821; --night:#0c1030; --paper:#efe7d4 }

[hidden]{display:none!important}
#banner{position:fixed;z-index:25}
.room{position:absolute;inset:0;overflow:hidden;border-radius:18px}
.room .wall{position:absolute;inset:0 0 22% 0;background:var(--wall)}
.room .floor{position:absolute;left:0;right:0;bottom:0;height:22%;background:var(--floor)}
.room.bath .wall{background-color:var(--tile);background-image:linear-gradient(var(--grout) 2px,transparent 2px),linear-gradient(90deg,var(--grout) 2px,transparent 2px);background-size:34px 34px}
.room.bedroom .wall{background-color:var(--wallbed);background-image:radial-gradient(var(--dot) 2.5px,transparent 3px);background-size:28px 28px}
.room.hall .wall{background:linear-gradient(transparent 68%,var(--wood2) 68% 70.5%,transparent 70.5%),var(--wall)}
.room svg{display:block;width:100%;height:auto;overflow:visible}
.obj{position:absolute;bottom:19%;translate:-50% 0;padding:0;border:0;background:none;cursor:pointer}
.toilet{width:min(30vw,140px)} .sink{width:min(26vw,120px)}
.toilet .lid-open{display:none} .toilet.open .lid-open{display:inline} .toilet.open .lid-closed{display:none}
.swirl{opacity:0;transform-box:fill-box;transform-origin:center}
.toilet.flush .swirl{animation:swirl 1.2s}
@keyframes swirl{20%{opacity:1}100%{opacity:0;rotate:720deg;scale:.2 .2}}
.sink .stream,.sink .suds{opacity:0;transition:opacity .2s} .sink.on .stream,.sink.on .suds{opacity:1}
.tapme{animation:tapme 1.4s ease-in-out infinite}
@keyframes tapme{0%,100%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 0 10px var(--gold)) drop-shadow(0 0 3px var(--gold))}}

.walker{left:50%;top:60%;translate:-50% -50%;width:min(28vw,130px);z-index:3;
  transition:left .9s ease-in-out,top .9s ease-in-out,width .5s,opacity .6s,scale .6s}
.walker.noanim{transition:none}
.walker.big{width:min(58vw,260px)} .walker.inbed{width:min(22vw,100px)} .walker.parent{width:min(32vw,150px)}
.walker.sitting .sp{scale:1 .86;translate:0 6%}
.walker.vanish{opacity:0;scale:.4 .4}
.walker.fly{animation:fly 1.2s cubic-bezier(.3,.7,.4,1)}
@keyframes fly{0%{translate:-50% -50%}45%{translate:-50% calc(-50% - 230px);rotate:200deg}100%{translate:-50% -50%;rotate:360deg}}
.hug{animation:hug .9s}
@keyframes hug{30%{scale:1.14 .88}60%{scale:.95 1.06}}
.sw.mom{--spider:#3a2740} .sw.dad{--spider:#20262f}
.bow,.specs,.teeth{display:none} .mom .bow,.dad .specs,.grin .teeth{display:inline} .grin .mouth{display:none}
.tooth{fill:var(--teeth,#fff)}

.mirror{position:absolute;left:50%;top:5%;translate:-50% 0;width:min(70vw,300px);height:60%;border-radius:999px 999px 24px 24px;
  background:linear-gradient(160deg,rgb(255 255 255/.6),rgb(200 225 240/.3));border:8px solid var(--wood)}
.brush{position:absolute;left:0;top:0;width:min(32vw,140px);pointer-events:none;z-index:6;transform-origin:84% 52%}
.foam{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px;border-radius:50%;background:#fff;border:1.5px solid #cfe3f0;
  pointer-events:none;z-index:7;animation:foam 1.1s forwards}
@keyframes foam{to{opacity:0;translate:0 -18px;scale:1.5 1.5}}

.showerhead{position:absolute;left:50%;top:0;translate:-50% 0;width:min(34vw,150px);pointer-events:none}
.water{position:absolute;left:50%;top:calc(min(34vw,150px)*.6);bottom:26%;translate:-50% 0;width:min(34vw,150px);pointer-events:none;opacity:0;transition:opacity .3s;z-index:4;overflow:hidden}
.water.on{opacity:1}
.drop{position:absolute;top:-20px;width:3px;height:16px;border-radius:2px;background:var(--water);animation:drop .55s linear infinite}
@keyframes drop{to{top:100%}}
.tub{position:absolute;left:50%;bottom:13%;translate:-50% 0;width:min(72vw,320px);height:min(18vw,80px);background:var(--porcelain);
  border:2px solid var(--line);border-radius:12px 12px 48px 48px;z-index:5}
.valve{position:absolute;left:13%;top:34%;translate:-50% 0;width:min(16vw,70px);padding:0;border:0;background:none;cursor:pointer;z-index:5}
.valve svg{transition:rotate .4s} .valve.on svg{rotate:120deg}
.soap{position:absolute;left:0;top:0;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);border-radius:50%;pointer-events:none;z-index:6;
  background:radial-gradient(circle at 30% 30%,#fff,rgb(255 255 255/.55) 40%,rgb(170 205 255/.35));border:1.5px solid rgb(255 255 255/.95);
  animation:pop .25s;transition:translate 1.2s ease-in,opacity 1.2s}
.soap.rinse{translate:0 120px;opacity:0}

.door{position:absolute;bottom:22%;translate:-50% 0;width:min(22vw,100px);aspect-ratio:.52;padding:0;border:6px solid var(--wood);border-bottom:0;
  border-radius:10px 10px 0 0;background:none;cursor:pointer;perspective:500px}
.door .inside{position:absolute;inset:0;background:var(--in)}
.door[data-k="kitchen"]{--in:#f3c27a} .door[data-k="bath"]{--in:#9fd3ef} .door[data-k="bed"]{--in:#24305e}
.door .panel{position:absolute;inset:0;background:var(--wood2);transform-origin:left center;transition:transform .5s}
.door.open .panel{transform:rotateY(-80deg)}
.door .knob{position:absolute;right:12%;top:50%;width:9px;height:9px;border-radius:50%;background:var(--gold)}
.door .sign{position:absolute;left:50%;bottom:calc(100% + 12px);translate:-50% 0;width:70%;aspect-ratio:1;border-radius:50%;background:var(--porcelain);
  border:3px solid var(--wood);display:grid;place-items:center}
.door .sign svg{width:72%}

.window{position:absolute;left:18%;top:8%;translate:-50% 0;width:min(26vw,120px);aspect-ratio:1;border:6px solid var(--wood);border-radius:8px;overflow:hidden;background:var(--night)}
.star{animation:tw 1.8s ease-in-out infinite alternate} .star:nth-child(odd){animation-delay:.9s}
@keyframes tw{to{opacity:.25}}
.bed{position:absolute;right:3%;bottom:15%;width:min(60vw,290px)}
.blanket{position:absolute;left:0;top:0;width:min(44vw,210px);translate:-50% -50%;padding:0;border:0;background:none;cursor:pointer;z-index:4;
  transition:left .8s ease-in-out,top .8s ease-in-out}
.blanket.noanim{transition:none} .blanket.chair{z-index:2}
.blanket svg{transform-origin:50% 100%}
.blanket .chair-g{display:none} .blanket.chair .flat-g{display:none} .blanket.chair .chair-g{display:inline}
.blanket.morph svg{animation:morph .6s} .blanket.squash svg{animation:squash .5s}
@keyframes morph{30%{scale:1.3 .6}60%{scale:.8 1.3}100%{scale:1 1}}
@keyframes squash{40%{scale:1.25 .55}70%{scale:.9 1.15}}
.cover{position:absolute;left:0;top:0;width:min(52vw,250px);translate:-50% -50%;z-index:5;pointer-events:none}
.cover .chair-g{display:none}
.lamp{position:absolute;left:20%;bottom:18%;translate:-50% 0;width:min(18vw,80px);padding:0;border:0;background:none;cursor:pointer}
.lamp .glow{transition:opacity .4s} .lamp.off .glow{opacity:0} .lamp.off .shade{fill:#a88d55}
.room.dark::after{content:"";position:absolute;inset:0;background:rgb(8 12 36/.62);z-index:2;pointer-events:none;animation:fadein 1.2s}
.room.dark .window{z-index:3;box-shadow:0 0 30px rgb(245 231 161/.45)}
@keyframes fadein{from{opacity:0}}

.book{position:absolute;left:50%;bottom:5%;translate:-50% 0;width:min(84vw,340px);aspect-ratio:2/1.1;display:flex;gap:4px;padding:6px;border:0;

<script>
const $=id=>document.getElementById(id);
const stage=$('stage'), threads=$('threads');
const rect=()=>stage.getBoundingClientRect();
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rand=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;
let soundOn=true, ac;

/* ================= нажатия не выделяют текст и не открывают меню ================= */
document.addEventListener('selectstart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= звук ================= */
/* Речь идёт по очереди: фраза не обрывает другую. У каждого паука в очереди
   не больше одной ждущей фразы, а устаревшие (старше 3 с) пропускаются. */
const sq=[]; let speaking=false, spId=0, spTimer=0;
function speak(text,pitch=.4,rate=1,who='B',voiceIdx=0){
  if(!soundOn||!('speechSynthesis' in window)) return;
  for(let i=sq.length-1;i>=0;i--) if(sq[i].who===who) sq.splice(i,1);
  // вслух: без кавычек и тире, иначе некоторые голоса произносят сами знаки («бэкслэш»)
  text=text.replace(/[«»„“”"\\]/g,'').replace(/\s+[—–]\s+/g,', ').replace(/,\s*,/g,',').replace(/([!?.…]),/g,'$1').trim();
  sq.push({text,pitch,rate,who,voiceIdx,t:performance.now()});
  if(!speaking) nextSpeech();
}
function nextSpeech(){
  clearTimeout(spTimer);
  let it; while((it=sq.shift())&&performance.now()-it.t>3000);
  if(!it){speaking=false;return}
  speaking=true; const id=++spId, done=()=>{if(id===spId)nextSpeech()};
  const u=new SpeechSynthesisUtterance(it.text);
  u.lang='ru-RU'; u.pitch=it.pitch; u.rate=it.rate;
  // Говорим только русским голосом. Если на устройстве его нет, лучше молчать:
  // иначе телефон читает русский текст словацким, японским или китайским голосом.
  const all=speechSynthesis.getVoices(), ru=ruVoices(all);
  if(all.length&&!ru.length){noRuVoice(true);speaking=false;sq.length=0;return}
  if(ru.length){const v=ru[Math.min(it.voiceIdx,ru.length-1)];u.voice=v;u.lang=v.lang.replace('_','-');noRuVoice(false)}
  u.onend=done; u.onerror=done;
  spTimer=setTimeout(done,1200+it.text.length*120); // на случай, если onend не придёт
  speechSynthesis.resume();
  speechSynthesis.speak(u);
}
function ruVoices(all){
  const ru=all.filter(v=>/^ru([-_]|$)/i.test(v.lang||''));
  // сначала голоса самого устройства и именно ru-RU: они надёжнее сетевых
  return ru.sort((a,b)=>(b.localService-a.localService)||(/ru[-_]RU/i.test(b.lang)-/ru[-_]RU/i.test(a.lang)));
}
function noRuVoice(on){const n=$('vnote'); if(n) n.hidden=!on}
function checkVoices(){const all=speechSynthesis.getVoices(); if(all.length) noRuVoice(!ruVoices(all).length)}
if('speechSynthesis' in window){
  checkVoices(); setTimeout(checkVoices,1500);
  try{speechSynthesis.addEventListener('voiceschanged',checkVoices)}catch(e){speechSynthesis.onvoiceschanged=checkVoices}
}
function stopSpeech(){sq.length=0;spId++;speaking=false;clearTimeout(spTimer);if('speechSynthesis' in window)speechSynthesis.cancel()}
/* iOS разрешает голос и звук только после настоящего касания (touchend/click).
   Тапы теперь ловятся через pointerdown, поэтому «разблокируем» речь отдельно. */
let unlocked=false;
function unlockAudio(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state!=='running') ac.resume()}catch(e){}
  if(unlocked||!('speechSynthesis' in window)) return;
  unlocked=true;
  const u=new SpeechSynthesisUtterance(' '); u.volume=0; u.lang='ru-RU';
  speechSynthesis.speak(u);
}
['touchend','click','keydown'].forEach(t=>addEventListener(t,unlockAudio,{capture:true}));
function tone(f,dur,type='triangle',delay=0,vol=.07,f2){
  if(!soundOn) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+delay;
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur+.05);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.06);
  }catch(e){}
}
const sfx={
  jump:()=>tone(180,.15,'square',0,.07,520),
  chomp:()=>{tone(300,.12,'sawtooth',0,.06,90);tone(280,.12,'sawtooth',.18,.06,80)},
  tick:n=>tone(520+n*70,.09,'sine',0,.08),
  yuck:()=>{tone(160,.35,'sawtooth',0,.07,70)},
  laugh:()=>[0,.14,.28,.42].forEach((d,i)=>tone(700-i*60,.09,'triangle',d,.07,500-i*60)),
  snore:()=>tone(90,.4,'sine',0,.08,60),
  fanfare:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',i*.1,.09));tone(1319,.5,'sine',.42,.06);tone(1568,.6,'sine',.55,.05)},
  whoosh:()=>tone(900,.3,'sine',0,.04,200),
  click:()=>tone(600,.05,'square',0,.05,300),
  flush:()=>{tone(700,1.1,'sine',0,.06,90);tone(400,1,'triangle',.1,.04,120)},
  water:()=>{for(let i=0;i<10;i++)tone(rand(900,1800),.05,'sine',i*.09,.025)},
  boing:()=>{tone(140,.25,'sine',0,.1,620);tone(620,.3,'sine',.25,.07,300)},
  magic:()=>[660,880,990,1320,1760].forEach((f,i)=>tone(f,.2,'sine',i*.07,.05)),
  page:()=>tone(1500,.12,'triangle',0,.03,500),
  door:()=>tone(220,.3,'sawtooth',0,.03,160),
  love:()=>[523,659,784].forEach((f,i)=>tone(f,.4,'sine',i*.12,.05)),
  lullaby:()=>[659,587,523,587,659,659,659].forEach((f,i)=>tone(f,.45,'sine',i*.42,.05)),
  poison:()=>{tone(1200,.25,'sawtooth',0,.03,300);[0,.18,.36].forEach((d,i)=>tone(260-i*40,.2,'sine',.25+d,.08,200-i*40))}
};
$('sound').addEventListener('click',()=>{
  soundOn=!soundOn; $('sound').setAttribute('aria-pressed',soundOn);
  $('sound').textContent=soundOn?'🔊 Звук':'🔇 Без звука';
  if(!soundOn) stopSpeech();
});

/* ================= конфетти ================= */
const fx=$('fx'), ctx=fx.getContext('2d'); let parts=[];
const CONF=['#d8432f','#7a3cc9','#e8a816','#4fae5a','#3d8fe0','#ff7ab0'];
function burst(x,y,n=60,power=9){
  for(let i=0;i<n;i++){const a=rand(0,TAU),p=rand(power*.3,power);
    parts.push({x,y,vx:Math.cos(a)*p,vy:Math.sin(a)*p-power*.5,r:rand(0,TAU),vr:rand(-.3,.3),w:rand(6,11),h:rand(4,7),c:pick(CONF),life:rand(60,110)})}
}
let fxDirty=true;
function drawFx(){
  if(!parts.length&&!fxDirty) return; fxDirty=parts.length>0;
  const dpr=Math.min(2,devicePixelRatio||1);
  if(fx.width!==innerWidth*dpr||fx.height!==innerHeight*dpr){fx.width=innerWidth*dpr;fx.height=innerHeight*dpr}
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life-->0);
  for(const p of parts){p.vy+=p.g??.25;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.min(1,p.life/30);
    ctx.fillStyle=p.c;
    if(p.heart){const s=p.w/20;ctx.beginPath();ctx.moveTo(0,6*s);ctx.bezierCurveTo(-14*s,-4*s,-6*s,-14*s,0,-6*s);
      ctx.bezierCurveTo(6*s,-14*s,14*s,-4*s,0,6*s);ctx.fill()}
    else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore()}
}
function hearts(x,y,n=16){
  for(let i=0;i<n;i++) parts.push({x,y,vx:rand(-2.5,2.5),vy:rand(-4,-1.5),g:-.03,r:rand(-.3,.3),vr:rand(-.02,.02),
    w:rand(16,26),h:0,c:pick(['#ff5a8a','#ff86b0','#e8436f']),life:rand(70,110),heart:true});
}
function banner(text){const b=$('banner');b.textContent=text;b.classList.remove('show');void b.offsetWidth;b.classList.add('show')}

/* ================= пауки ================= */
const spiders=[];
function makeSpider(cls,anchor,label){
  const node=$('spiderTpl').content.firstElementChild.cloneNode(true);
  if(cls) node.classList.add(cls);

const huntQueue=[];
function hunt(b){
  if(b.dead||b.caught||level===0||B.poisoned||B.scared||B.tickled||!['home','return','eating','hunt'].includes(B.state)) return;
  b.caught=true; b.el.classList.add('caught');

function render(){

  $('task').textContent=L.title; $('hint').textContent=L.hint;
  const turns=eyeAcc/TAU;

  $('barMe').style.width=Math.min(100,frac*100)+'%';
  $('barRivalWrap').hidden=!L.race;

  $('barR').style.width=Math.min(100,rprog/L.goal*100)+'%';
  $('count').innerHTML=L.race?`Ты <b>${prog}</b> : <em style="color:${RIVALS[L.race].color}">${rprog}</em> ${RIVALS[L.race].name}`
    :L.key==='eyes'?`<b>${Math.min(L.goal,Math.floor(turns))}</b> / ${L.goal} ${L.unit}`
    :`<b>${prog}</b> / ${L.goal}${L.unit?' '+L.unit:''}`;
}
function addProg(n){
  const L=LEVELS[level]; if(!L||busy) return;
  prog=Math.max(0,prog+n); render();

}

}
function enterLevel(i){
  if(episode!==1){level=i;save();return} // отложенный переход, а игрок уже ушёл в меню

  const key=LEVELS[i]?.key||'final';
  B.wrap.classList.toggle('asleep',key==='wake');

      setTimeout(()=>talk(B,'Синие вонючки! Их надо съесть, пока не пшикнули!'),1200); break;

    case 'eyes': spawnOn=false; setTimeout(()=>talk(B,'Ой, глаза затекли! Давай их покрутим!'),200); break;
    case 'jump': spawnOn=false; setTimeout(()=>talk(B,'Теперь попрыгаем!'),200); break;
    case 'eat': spawnOn=true; maxBugs=3; badChance=0; setTimeout(()=>talk(B,'Ух, проголодался!'),200); break;
    case 'purple': spawnOn=true; maxBugs=4; badChance=0; if(!R) summonRival('purple'); break;
    case 'red': case 'blue': case 'green': {
      const want=LEVELS[i].race||LEVELS[i].rival, still=()=>level===i&&!R; spawnOn=true; maxBugs=4; badChance=0;
      if(R&&R.cfg.cls!==want){dismissRival();setTimeout(()=>{if(still())summonRival(want)},1800)}
      else if(!R){if(key==='red')summonRival(want);else setTimeout(()=>{if(still())summonRival(want)},1200)}

      if(key==='green') setTimeout(()=>talk(B,'Ой, а этот зелёный!'),300);

    case 'yuck': spawnOn=true; maxBugs=5; badChance=.4; dismissRival();
      setTimeout(()=>talk(B,'Осторожно! Осы и вонючки невкусные!'),1200); break;
    default: spawnOn=true; maxBugs=5; badChance=.2; poisonChance=.15; dismissRival();

let pointer=null, lastA=null;
addEventListener('pointermove',e=>{
  pointer={x:e.clientX,y:e.clientY};
  if(episode!==1||LEVELS[level]?.key!=='eyes'||busy) return;
  if(e.pointerType==='touch'&&e.buttons===0) return;
  const c=spiderCenter(B), dx=e.clientX-c.x, dy=e.clientY-c.y;
  if(Math.hypot(dx,dy)<B.wrap.offsetWidth*.22){lastA=null;return}
  const a=Math.atan2(dy,dx);
  if(lastA!==null){
    let d=a-lastA; while(d>Math.PI)d-=TAU; while(d<-Math.PI)d+=TAU;
    if(Math.abs(d)<1){
      const before=Math.floor(eyeAcc/(TAU/4));
      eyeAcc+=Math.abs(d);
      if(Math.floor(eyeAcc/(TAU/4))>before) sfx.tick(Math.floor(eyeAcc/(TAU/4)));
      render();
      if(eyeAcc>=LEVELS[level].goal*TAU) complete();
    }
  }
  lastA=a;
});
addEventListener('pointerup',()=>{lastA=null});
addEventListener('pointercancel',()=>{lastA=null});

/* ================= игровой цикл ================= */
function update(s,h){
  s.anchor+=(s.anchorT-s.anchor)*.05;
  const o=home(s);
  if(!s.init){s.x=o.x;s.y=o.y;s.init=true}
  switch(s.state){
    case 'home': s.x=o.x; s.y=o.y; break;
    case 'enter': s.x=o.x; s.y+=(o.y-s.y)*.06;
      if(Math.abs(o.y-s.y)<1.5){s.y=o.y;s.state='home';s.onArrive&&s.onArrive()} break;
    case 'leave': s.x=o.x; s.y+=(-h*2-s.y)*.05; if(s.y<-h*1.3){destroy(s);return false} break;
    case 'tickle': {
      const tx=B.x+B.wrap.offsetWidth*.55, ty=B.y, dx=tx-s.x, dy=ty-s.y, d=Math.hypot(dx,dy);
      if(s.tickleOn){s.x=tx+Math.sin(performance.now()/40)*7;s.y=ty}
      else if(d<9) startTickle(s);
      else{const v=Math.min(7,d);s.x+=dx/d*v;s.y+=dy/d*v}
      break}
    case 'flee': s.x+=(o.x-s.x)*.12; s.y+=(-h*.2-s.y)*.12; break;
    case 'hunt': {
      const b=s.target;
      if(!b||b.dead){s.target=null;if(s.feast)feastNext(s);else s.state='return';break}
      const tx=b.x, ty=b.y-h*.22, dx=tx-s.x, dy=ty-s.y, d=Math.hypot(dx,dy);
      if(s===B){s.x+=dx*.2;s.y+=dy*.2;if(d<8)blackCatch(b)}
      else if(d<10&&!b.caught) rivalCatch(s,b);
      else if(d>1){const v=Math.min(s.feast?8:s.cfg.speed,d);s.x+=dx/d*v;s.y+=dy/d*v}
      break}
    case 'return': s.x+=(o.x-s.x)*.08; s.y+=(o.y-s.y)*.08;
      if(Math.hypot(o.x-s.x,o.y-s.y)<2){s.x=o.x;s.y=o.y;s.state='home';if(s===R)planRival()} break;
  }
  s.btn.classList.toggle('crawl',['hunt','return','enter','leave','flee','tickle'].includes(s.state));
  return true;
}
function frame(){
  if(episode!==1){drawFx();requestAnimationFrame(frame);return}   // в других эпизодах первый не считается в фоне
  const r=rect(), h=H(), now=performance.now();
  for(const b of bugs.filter(b=>b.K.poison&&!b.caught&&!b.dead)){
    const rem=b.fuse-now;
    b.el.style.setProperty('--p',Math.max(0,Math.min(1,rem/FUSE)));
    b.el.classList.toggle('hurry',rem<2000);
    if(rem<=0) explode(b);
  }
  for(const b of bugs){
    if(b.caught){b.el.style.transform=`translate(${b.x}px,${b.y}px)`;continue}
    b.t+=.02;
    b.a+=Math.sin(b.t*1.7+b.x*.01)*.05+(Math.random()-.5)*.08;
    const m=40, top=r.height*.32;
    if(b.x<m&&Math.cos(b.a)<0||b.x>r.width-m&&Math.cos(b.a)>0) b.a=Math.PI-b.a;
    if(b.y<top&&Math.sin(b.a)<0||b.y>r.height-m&&Math.sin(b.a)>0) b.a=-b.a;
    for(const s of spiders){
      const dx=b.x-s.x, dy=b.y-(s.y+h*.4), d=Math.hypot(dx,dy);
      if(d<h*.8) b.a+=(Math.atan2(dy,dx)-b.a)*.08;
    }
    const sp=b.K.speed*(level>=6?1.2:1);
    b.x+=Math.cos(b.a)*sp; b.y+=Math.sin(b.a)*sp;
    b.x=Math.min(Math.max(b.x,-30),r.width+30); b.y=Math.min(Math.max(b.y,20),r.height-20);
    const turn=b.k==='ladybug'||b.k==='stinkbug';
    b.el.style.transform=`translate(${b.x}px,${b.y}px) rotate(${turn?b.a*57.3+90:0}deg) scaleX(${turn?1:(Math.cos(b.a)<0?-1:1)})`;
  }
  for(const s of [...spiders]){
    if(!update(s,h)) continue;
    s.wrap.style.transform=`translate(${s.x-s.wrap.offsetWidth/2}px,${s.y-h*.35}px)`;
    s.line.setAttribute('x1',r.width*s.anchor);s.line.setAttribute('y1',-5);
    s.line.setAttribute('x2',s.x);s.line.setAttribute('y2',s.y);
    clampBubble(s,r.width);
  }
  drawFx();
  requestAnimationFrame(frame);
}

/* глаза */
setInterval(()=>{

  const eyesLevel=LEVELS[level]?.key==='eyes';
  for(const s of spiders){
    let p=null, d=3;
    if(s===B&&B.poisoned){const a=performance.now()/90;p={x:Math.cos(a),y:Math.sin(a)};d=4.5}
    else if(s===B&&eyesLevel&&pointer){const c=spiderCenter(B);p={x:pointer.x-c.x,y:pointer.y-c.y};d=5}
    else{
      let t=s.target;
      if(!t&&bugs.length){let best=1e9;for(const b of bugs){const q=Math.hypot(b.x-s.x,b.y-s.y);if(q<best){best=q;t=b}}}
      if(t) p={x:t.x-s.x,y:t.y-(s.y+H()*.1)};
      else if(R&&s===B) p={x:R.x-B.x,y:0};
    }
    if(!p) continue;
    const a=Math.atan2(p.y,p.x);
    s.pl.setAttribute('cx',90+Math.cos(a)*d);s.pl.setAttribute('cy',82+Math.sin(a)*d);
    s.pr.setAttribute('cx',110+Math.cos(a)*d);s.pr.setAttribute('cy',82+Math.sin(a)*d);
  }
},50);

const wait=ms=>new Promise(r=>setTimeout(r,ms));
const rr=()=>room.getBoundingClientRect();
function anchor(el,fx,fy){const r=el.getBoundingClientRect(),s=rr();return{x:r.left-s.left+r.width*fx,y:r.top-s.top+r.height*fy}}
function put(t,p){t.wrap.style.left=p.x+'px';t.wrap.style.top=p.y+'px'}
function walk(t,p,ms=950){t.btn.classList.add('crawl');put(t,p);return wait(ms).then(()=>t.btn.classList.remove('crawl'))}
function standPos(fx,t){const s=rr(),h=t.wrap.offsetWidth*.85;return{x:s.width*fx,y:s.height*.8-h*.5}}
function talk2(t,text,ms){say(t,bold(text),ms);speak(text,t.pitch,t.rate,t.who,t.voice)}
function tapme(el,on){if(el)el.classList.toggle('tapme',on)}
function mix(a,b,t){t=Math.max(0,Math.min(1,t));const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);
  return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function clampDom(s){
  const bb=s.bubble; if(!bb||!bb.classList.contains('show')) return;
  const st=rr(), wr=s.wrap.getBoundingClientRect(), left=wr.left-st.left+bb.offsetLeft, w=bb.offsetWidth;
  let shift=0; if(left+w>st.width-6) shift=st.width-6-(left+w); if(left+shift<6) shift=6-left;
  // по высоте тоже: если облачко вылезает за верх сцены, опускаем его и прячем хвостик
  const prev=+bb.dataset.dy||0, natTop=bb.getBoundingClientRect().top-st.top-prev;
  const dy=natTop<6?Math.round(6-natTop):0; bb.dataset.dy=dy;
  bb.classList.toggle('nt',dy>0);
  bb.style.translate=`${shift}px ${dy}px`;
}
function makeWalker(cls,opts={}){
  const node=$('spiderTpl').content.firstElementChild.cloneNode(true);
  node.classList.add('walker','noanim'); (cls||'').split(' ').filter(Boolean).forEach(c=>node.classList.add(c));
  room.appendChild(node);
  const t={wrap:node,btn:node.querySelector('.sp'),bubble:node.querySelector('.bubble'),mouth:node.querySelector('.mouth'),
    pl:node.querySelector('.pl'),pr:node.querySelector('.pr'),stageEl:room,pitch:.4,rate:1.1,who:'B',voice:0,...opts};
  node.querySelector('.sp').setAttribute('aria-label',opts.label||'Чёрный паук');
  requestAnimationFrame(()=>requestAnimationFrame(()=>node.classList.remove('noanim')));
  talkers2.push(t); return t;
}
function makeMain(cls){
  const t=makeWalker(cls);
  t.btn.addEventListener('pointerdown',e=>{
    if(handlers2.move) return; // в сценах с рисованием пальцем тап по пауку — часть игры
    e.preventDefault(); if(busy2) return;
    if(t.wrap.classList.contains('asleep')){say(t,'<b>Хррр…</b>',1000);return}
    restart(t.btn,'jump'); sfx.jump(); talk2(t,pick(['Я чёрный паук!','Хи-хи, щекотно!','Скоро спать!']));
  });
  return t;
}
function talkerFor(el,opts){const t={wrap:el,bubble:el.querySelector('.bubble'),stageEl:room,...opts};talkers2.push(t);return t}
function placeEl(el,p,instant){if(instant)el.classList.add('noanim');el.style.left=p.x+'px';el.style.top=p.y+'px';
  if(instant)requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove('noanim')))}

function render2(){
  $('steps').innerHTML=EPX.map((_,i)=>`<i class="${i<l2?'done':i===l2?'now':''}"></i>`).join('');
  const fin=l2>=EPX.length;
  $('bars').hidden=fin; $('count').hidden=fin; $('replay').hidden=!fin; $('replay').textContent='В меню';
  $('barRivalWrap').hidden=true;
  if(fin){$('eyebrow').textContent=`Эпизод ${EPS.n} пройден`;$('task').textContent=EPS.fin[0];$('hint').textContent=EPS.fin[1];return}
  const L=EPX[l2];
  $('eyebrow').textContent=`Эпизод ${EPS.n} · этап ${l2+1} из ${EPX.length}`;
  $('task').textContent=L.title; $('hint').textContent=hint2;
  $('barMe').style.width=Math.min(100,p2/L.goal*100)+'%';
  $('count').innerHTML=`<b>${Math.min(p2,L.goal)}</b> / ${L.goal}${L.unit?' '+L.unit:''}`;
}
function setHint(t){hint2=t;render2()}
function add2(n,auto=true){
  if(busy2) return; p2=Math.max(0,p2+n); render2(); if(n>0) sfx.tick(p2);
  if(auto&&p2>=EPX[l2].goal) celebrate2();
}
function celebrate2(){
  busy2=true; const L=EPX[l2], r=S2.wrap.getBoundingClientRect();
  burst(r.left+r.width/2,r.top+r.height/2,70,10);
  setTimeout(()=>{burst(innerWidth*.2,innerHeight*.35,40,8);burst(innerWidth*.8,innerHeight*.35,40,8)},250);
  sfx.fanfare(); banner(pick(['Отлично!','Супер!','Молодец!','Класс!','Ура!']));
  if(L.done) talk2(S2,L.done,2200);
  const sid=sceneId; setTimeout(()=>{if(sid===sceneId){busy2=false;enter2(l2+1)}},2600);
}
function leave2(){sceneId++;room.innerHTML='';talkers2=[];S2=null;handlers2={};busy2=false}
function enter2(i){
  l2=i; p2=0; busy2=false; lsSet(EPS.store,i);
  restart($('stage2'),'enter');
  sceneId++; talkers2=[]; handlers2={}; room.innerHTML=''; room.className='room';
  $('steps').innerHTML='';
  if(i>=EPX.length){render2();return}
  hint2=''; render2(); restart($('hud'),'pop');
  const sid=sceneId, alive=()=>sid===sceneId;
  requestAnimationFrame(()=>{if(alive()) SCENES[EPX[i].key](alive)});
}

const pt2=e=>{const s=rr();return{x:e.clientX-s.left,y:e.clientY-s.top}};
$('stage2').addEventListener('pointerdown',e=>{handlers2.down?.(e,pt2(e))});
addEventListener('pointermove',e=>{if(episode<2)return;ptr2={x:e.clientX,y:e.clientY};handlers2.move?.(e,pt2(e))});
addEventListener('pointerup',e=>{if(episode>=2)handlers2.up?.(e)});
addEventListener('pointercancel',e=>{if(episode>=2)handlers2.up?.(e)});

/* облачка в пределах сцены и глаза, следящие за пальцем */
function loop2(){
  if(episode>=2){
    const arcadeOn=S2&&S2.wrap.classList.contains('free'); loop2.n=(loop2.n||0)+1;
    if(!arcadeOn||loop2.n%8===0) for(const t of talkers2) clampDom(t);
    if(!arcadeOn&&S2&&ptr2&&S2.pl&&!S2.wrap.classList.contains('asleep')){
      const r=S2.btn.getBoundingClientRect(), a=Math.atan2(ptr2.y-(r.top+r.height*.5),ptr2.x-(r.left+r.width/2));
      S2.pl.setAttribute('cx',90+Math.cos(a)*3);S2.pl.setAttribute('cy',82+Math.sin(a)*3);
      S2.pr.setAttribute('cx',110+Math.cos(a)*3);S2.pr.setAttribute('cy',82+Math.sin(a)*3);
    }
  }
  requestAnimationFrame(loop2);
}

/* 2–4. Камни с примерами */
/* Примеры: три действия, у каждого пять уровней сложности (0–4).
   Уровень подбирается сам: быстрый правильный ответ его поднимает, ошибка или съеденная рыбой муха опускает. */
const OPS={add:{sym:'+',word:'плюс',start:2},sub:{sym:'−',word:'минус',start:2},mul:{sym:'×',word:'умножить на',start:1}};
const skill={}; for(const k in OPS) skill[k]=Math.max(0,Math.min(4.9,lsGet('spider-skill-'+k,OPS[k].start)));
function tierOf(op){return Math.max(0,Math.min(4,Math.floor(skill[op])))}
function adjustSkill(op,d){skill[op]=Math.max(0,Math.min(4.9,skill[op]+d));lsSet('spider-skill-'+op,skill[op].toFixed(2))}
function makeExample(op,tier,prev){
  const R=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
  for(let k=0;k<60;k++){
    let a,b,ans;
    if(op==='add'){
      if(tier<=0){a=R(1,4);b=R(1,5-a)}                                   // до 5
      else if(tier===1){a=R(2,8);b=R(2,10-a);if(a+b<6)continue}           // до 10
      else if(tier===2){a=R(4,9);b=R(3,9);if(a+b<11)continue}             // до 20 через десяток
      else if(tier===3){a=R(12,49);b=R(3,9);if(a%10+b<10)continue}        // двузначное + однозначное через десяток
      else{a=R(12,59);b=R(12,39)}                                         // двузначные, до 100
      ans=a+b;
    }else if(op==='sub'){
      if(tier<=0){a=R(2,5);b=R(1,a-1)}
      else if(tier===1){a=R(5,10);b=R(1,a-1)}
      else if(tier===2){a=R(11,18);b=R(3,9);if(a-b>9)continue}
      else if(tier===3){a=R(21,60);b=R(3,9);if(a%10>=b)continue}
      else{a=R(31,99);b=R(12,a-10)}
      ans=a-b;
    }else{
      if(tier<=0){a=pick([1,2,10]);b=R(1,5)}
      else if(tier===1){a=pick([2,3,5,10]);b=R(2,6)}
      else if(tier===2){a=R(2,5);b=R(2,10)}
      else if(tier===3){a=R(3,9);b=R(3,10)}
      else{a=R(6,12);b=R(6,12)}                                           // таблица до 12 × 12
      if(Math.random()<.5)[a,b]=[b,a];
      ans=a*b;
    }
    if(prev&&prev.a===a&&prev.b===b&&prev.op===op) continue;
    const steps=op==='mul'?[a,-a,b,-b,1,-1,2,-2,10,-10]:ans>20?[1,-1,2,-2,10,-10]:[1,-1,2,-2];
    const opts=new Set([ans]); let guard=0;

    if(opts.size<3) continue;
    return{a,b,op,tier,ans,sym:OPS[op].sym,word:OPS[op].word,opts:[...opts].sort(()=>Math.random()-.5)};
  }
}

  let pos=0, dir=1, rate=0, taunted=false; // рыба плавает туда-сюда и не возвращается в начало при новом примере

    $('r-lvl').innerHTML=Array.from({length:5},(_,i)=>`<i class="${i<=ex.tier?'on':''}"></i>`).join('');
    ex.opts.forEach((v,i)=>{

      el.style.setProperty('--fc',FLY_COLORS[(colorShift+i)%FLY_COLORS.length]);

      const f={el,v,tx,ty,x:tx+rand(-90,90),y:-50-i*30,enter:true,a:rand(0,TAU),sp:rand(.8,1.2),held:false};
      el.addEventListener('pointerdown',e=>{e.preventDefault();grab(f)});
      el.addEventListener('click',e=>{if(e.detail===0)grab(f)});
      el.style.transform=`translate(${f.x}px,${f.y}px)`; room.appendChild(el); flies.push(f);
    });
    speak(`Сколько будет ${ex.a} ${ex.word} ${ex.b}?`,S2.pitch,S2.rate,S2.who,S2.voice); // без облачка: пример и так написан внизу

    if(f.v===ex.ans){

      const sec=(performance.now()-tAsk)/1000;
      if(!miss) adjustSkill(ex.op,sec<5?.6:sec<9?.35:sec<14?.1:0);   // быстро и без ошибок: сложнее
      put(S2,onStone($('r-st'+(p2+1)))); talk2(S2,`${ex.ans}! Правильно!`); add2(1,false);

    } else if(!opt.strict){
      miss++; adjustSkill(ex.op,-.7);

      put(S2,onStone($('r-st'+p2))); talk2(S2,pick(['Тьфу! Не та муха! Назад…','Бе! Не тот ответ!','Ой! Отлетел назад. Посчитай ещё раз.']));

      talk2(S2,'Бултых! Не та муха… Начинаю сначала!',2400);

  async function fishEats(){

    for(const f of flies){

        if(d<3) f.enter=false; else{f.x+=dx/d*st; f.y+=dy/d*st}

      if(f.x<x0){f.x=x0;f.a=Math.PI-f.a} if(f.x>x1){f.x=x1;f.a=Math.PI-f.a}
      if(f.y<y0){f.y=y0;f.a=-f.a} if(f.y>y1){f.y=y1;f.a=-f.a}
      f.el.style.transform=`translate(${f.x}px,${f.y}px)`;
    }
    if(fishEl&&!fishBusy){
      if(!lock&&!busy2&&flies.length) pos=Math.max(0,Math.min(1,pos+dir*rate*dt));
      fishEl.style.left=fishX(s.width)+'px'; fishEl.style.top=s.height*FISH_Y+Math.sin(now/260)*4+'px';

/* Сказка «Паучок и звёздочка»: на каждой странице спрятана маленькая звёздочка,
   а в четырёх местах сказка останавливается и игрок помогает героям (мини-игры) */
const TALE_MINI={5:'weave',7:'wind',9:'light',14:'beam'};
let HID=null; // {pos:[[x,y]…18], found:[номера страниц]}
function ensureHid(fresh){
  if(!fresh){try{HID=JSON.parse(localStorage.getItem('spider-ep4-hid'))}catch(e){}}
  if(fresh||!HID||!HID.pos){HID={pos:TALE.map(()=>[Math.round(rand(10,150)),Math.round(rand(8,80))]),found:[]}}
  try{localStorage.setItem('spider-ep4-hid',JSON.stringify(HID))}catch(e){}
}
function taleScene(alive,from,count,book=TALE,opts={}){
  room.className='room bedroom';
  room.innerHTML=BED_ROOM+`<button class="storybook" id="r-sb" aria-label="Книжка со сказкой. Нажми, чтобы перевернуть страницу"><div class="pgin" id="r-pg" aria-live="polite"></div></button>`;
  const sb=$('r-sb'); let idx=0, lock=true, miniDone=true, miniStop=null;
  const hidOn=!!opts.hidden;
  const render=i=>{const gi=from+i, P=book[gi];
    const hid=hidOn&&!HID.found.includes(gi)?`<g class="hid" data-p="${gi}"><circle cx="${HID.pos[gi][0]}" cy="${HID.pos[gi][1]}" r="7" fill="transparent"/><path transform="translate(${HID.pos[gi][0]} ${HID.pos[gi][1]})" d="M0 -4 L1.1 -1.1 L4 0 L1.1 1.1 L0 4 L-1.1 1.1 L-4 0 L-1.1 -1.1Z" fill="#fff8c0"/></g>`:'';
    const svg=T.wrap(P.p()).replace('</svg>',hid+'</svg>');
    const found=hidOn?`<span class="hidc">⭐ ${HID.found.length} / ${book.length}</span>`:'';
    $('r-pg').innerHTML=`<div class="pic">${svg}<div class="mini" id="r-mini" hidden></div></div><div class="tx">${P.t}</div><div class="pn"><span class="nx">${i<count-1?'Дальше ›':'Конец главы ›'}</span>${found}<span>${gi+1} / ${book.length}</span></div>`;
    if(miniStop){miniStop();miniStop=null}
    miniDone=true;
    if(opts.minis&&TALE_MINI[gi]){ miniDone=false; $('r-pg').querySelector('.nx').classList.add('off');
      setTimeout(()=>{ if(alive()&&idx===i) miniStop=MINI[TALE_MINI[gi]]($('r-mini'),()=>{ miniDone=true; const nx=$('r-pg').querySelector('.nx'); if(nx) nx.classList.remove('off') }) },2600) }
  };
  const read=i=>{speak(book[from+i].t,.5,.92,'B',0); lock=true; setTimeout(()=>{lock=false},900)};
  render(0);
  S2=makeMain('small'); const p=anchor(sb,.8,0); p.y-=S2.wrap.offsetWidth*.42; put(S2,p); // сидит на верхнем краю книжки
  setHint(hidOn?'На каждой странице спрятана звёздочка — найди её! Чтобы читать дальше, нажми на текст'
               :'Нажимай на картинку, там всё живое. Чтобы читать дальше, нажми на текст');
  setTimeout(()=>alive()&&read(0),600);
  function poke(g){
    const P=POKES[g.dataset.k]; if(!P) return;
    restart(g,'boing'); P.snd();
    const text=pick(typeof P.say==='function'?P.say():P.say); say(S2,bold(text),1400); speak(text,.75,1.1,'poke',0);
  }
  function sparkle(svg,e){ // нажали мимо всех: на небе вспыхивает искорка
    const r=svg.getBoundingClientRect(), x=(e.clientX-r.left)/r.width*160, y=(e.clientY-r.top)/r.height*90;
    const g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.setAttribute('class','spark');
    g.innerHTML=`<path d="M${x} ${y-6} L${x+1.5} ${y-1.5} L${x+6} ${y} L${x+1.5} ${y+1.5} L${x} ${y+6} L${x-1.5} ${y+1.5} L${x-6} ${y} L${x-1.5} ${y-1.5}Z" fill="#fff"/>`;
    svg.appendChild(g); setTimeout(()=>g.remove(),700); tone(rand(1400,2000),.1,'sine',0,.04);
  }
  function findHidden(h){
    const gi=+h.dataset.p; if(HID.found.includes(gi)) return;
    HID.found.push(gi); try{localStorage.setItem('spider-ep4-hid',JSON.stringify(HID))}catch(e){}
    const r=h.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2,18,5); sfx.magic();
    h.remove(); const c=$('r-pg').querySelector('.hidc'); if(c) c.textContent=`⭐ ${HID.found.length} / ${book.length}`;
    say(S2,bold(pick(['Нашла звёздочку!','Ура, звёздочка!','Вот она где!'])).replace('Нашла','Нашли'),1200);
  }
  sb.onclick=e=>{
    if(e.target.closest('.mini')) return;            // мини-игра ловит нажатия сама
    const h=e.target.closest('.hid'); if(h){findHidden(h);return}
    const g=e.target.closest('.tp'), svg=e.target.closest('svg');
    if(g){poke(g);return}
    if(svg&&e.clientX){sparkle(svg,e);return}   // по картинке страницы не листаются
    if(lock||busy2) return;
    if(!miniDone){ restart(S2.btn,'shake'); say(S2,'<b>Сначала помоги паучку!</b>',1200); return }
    sfx.page();
    if(idx<count-1){idx++; add2(1,false); render(idx); restart(sb,'turn'); read(idx)}
    else add2(1);
  };
}

/* ---- мини-игры внутри сказки: каждая рисует свою сцену поверх картинки и зовёт done() ---- */
const MINI={};
function miniBase(el,label){
  el.hidden=false; el.innerHTML=`<svg viewBox="0 0 160 90"></svg><div class="mlabel">${label}</div><div class="mbar"><i></i></div>`;
  const svg=el.querySelector('svg'), bar=el.querySelector('.mbar i');
  speak(label.replace(/ — /,', '),.75,1,'B',0);
  const pt=e=>{const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*160,y:(e.clientY-r.top)/r.height*90}};
  return {svg,bar,pt,label:t=>{el.querySelector('.mlabel').textContent=t}};
}
function miniWin(el,m,done,text){
  m.label(text); m.bar.style.width='100%'; sfx.fanfare(); const r=el.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2,30,7);
  say(S2,bold(text),1500); done(); setTimeout(()=>{el.classList.add('fade');setTimeout(()=>{el.hidden=true;el.classList.remove('fade')},600)},1500);
}
// 1) плетём ниточку до неба: вести пальцем вверх
MINI.weave=(el,done)=>{
  const m=miniBase(el,'Веди пальцем вверх — плети ниточку до неба!'); let p=0, last=null, fin=false;
  const draw=()=>{ const top=62-60*p; m.svg.innerHTML=T.night()+T.house()+T.star(122,74,7)+`<path d="M96 62 L96 ${top}" stroke="#e8ecf5" stroke-width="1.6"/>`+T.sp(96,66,.5)+(p<1?`<path d="M96 ${top-4} l-3 5 h6z" fill="#ffe27a"/>`:''); m.bar.style.width=(p*100)+'%' };
  draw();
  el.onpointerdown=e=>{e.preventDefault();e.stopPropagation();last=m.pt(e)};
  el.onpointermove=e=>{ if(fin||!last||!(e.buttons&1)) return; const q=m.pt(e), dy=last.y-q.y; last=q;
    if(dy>0){ p=Math.min(1,p+dy/120); draw(); if(Math.random()<.25) tone(800+p*800,.04,'sine',0,.03);
      if(p>=1){fin=true; miniWin(el,m,done,'Ниточка до самого неба!')} } };
  el.onpointerup=()=>{last=null};
  return ()=>{fin=true};
};
// 2) ветер качает ниточку: нажимать, чтобы удержать паучка посередине
MINI.wind=(el,done)=>{
  const m=miniBase(el,'Ветер! Нажимай, чтобы паучок не раскачивался'); let d=0,v=0,p=0,t=0,fin=false,last=performance.now();
  el.onpointerdown=e=>{e.preventDefault();e.stopPropagation(); if(fin) return; v*=.2; d*=.45; tone(500,.06,'sine',0,.05)};
  (function f(){ if(fin||!document.body.contains(el)) return;
    const now=performance.now(), dt=Math.min(.05,(now-last)/1000); last=now; t+=dt;
    v+=(Math.sin(t*1.3)*.9+Math.sin(t*2.7+1)*.6)*dt*60; v*=Math.exp(-.8*dt); d=Math.max(-50,Math.min(50,d+v*dt));
    const calm=Math.abs(d)<16; p=Math.max(0,Math.min(1,p+(calm?dt/5:-dt/14)));
    const x=80+d;
    m.svg.innerHTML=T.night(true)+`<g opacity="${.4+Math.min(.6,Math.abs(v)/40)}">${T.wind()}</g><rect x="64" y="0" width="32" height="90" fill="#7fd07a" opacity=".12"/>`+`<path d="M80 0 Q${80+d*.4} 25 ${x} 46" stroke="#e8ecf5" stroke-width="1.2" fill="none"/>`+T.sp(x,50,.5)+T.star(x,38,6,calm?'':'sad');
    m.bar.style.width=(p*100)+'%';
    if(p>=1){fin=true; miniWin(el,m,done,'Удержали! Ветер стих.'); return}
    requestAnimationFrame(f) })();
  return ()=>{fin=true};
};
// 3) светлячок светит: водить пальцем-фонариком и найти паучка в темноте
MINI.light=(el,done)=>{
  const m=miniBase(el,'Темно! Води пальцем, как фонариком, и нажми на паучка'); let fin=false, lx=80, ly=45;
  const tx=Math.round(rand(20,140)), ty=Math.round(rand(26,70));
  const draw=()=>{ m.svg.innerHTML=`<defs><mask id="mk"><rect width="160" height="90" fill="#fff"/><circle cx="${lx}" cy="${ly}" r="18" fill="#000"/></mask></defs>`+
      T.night(true)+T.thread(tx,0,ty)+T.sp(tx,ty+4,.45)+T.star(tx,ty-7,5)+
      (fin?'':`<rect width="160" height="90" fill="#05070f" mask="url(#mk)"/>`)+T.fly(lx+12,ly-10,.8); m.bar.style.width=fin?'100%':'0%' };
  draw();
  const move=e=>{const q=m.pt(e); lx=q.x; ly=q.y; draw()};
  el.onpointermove=e=>{ if(!fin) move(e) };
  el.onpointerdown=e=>{ e.preventDefault(); e.stopPropagation(); if(fin) return; move(e);
    if(Math.hypot(lx-tx,ly-ty)<14){ fin=true; draw(); miniWin(el,m,done,'Нашли паучка и звёздочку!') } };
  return ()=>{fin=true};
};
// 4) звёздочка бежит по лучику: вести её пальцем к луне
MINI.beam=(el,done)=>{
  const m=miniBase(el,'Веди звёздочку пальцем по лучику к луне'); let t=0, fin=false, drag=false;
  const A={x:40,y:80}, B={x:122,y:28};
  const draw=()=>{ const x=A.x+(B.x-A.x)*t, y=A.y+(B.y-A.y)*t;
    m.svg.innerHTML=T.night()+`<path d="M${A.x} ${A.y} L${B.x} ${B.y}" stroke="#f5e7a1" stroke-width="10" stroke-linecap="round" opacity=".35"/><path d="M${A.x} ${A.y} L${B.x} ${B.y}" stroke="#fff" stroke-width="1.5" stroke-dasharray="3 4" opacity=".8"/>`+
      T.moon(130,20,13)+T.star(x,y,7.5)+T.moth(30,80,.6); m.bar.style.width=(t*100)+'%' };
  draw();
  const follow=e=>{ const q=m.pt(e), dx=B.x-A.x, dy=B.y-A.y, L2=dx*dx+dy*dy, k=Math.max(0,Math.min(1,((q.x-A.x)*dx+(q.y-A.y)*dy)/L2));
    const px=A.x+dx*k, py=A.y+dy*k; if(Math.hypot(q.x-px,q.y-py)<16&&k<t+.25){ if(k>t){t=k; if(Math.random()<.3) tone(900+t*700,.05,'sine',0,.03)} draw();
      if(t>=.96){fin=true; t=1; draw(); miniWin(el,m,done,'Звёздочка дома, на небе!')} } };
  el.onpointerdown=e=>{e.preventDefault();e.stopPropagation(); if(fin) return; drag=true; follow(e)};
  el.onpointermove=e=>{ if(drag&&!fin&&(e.buttons&1)) follow(e) };
  el.onpointerup=()=>{drag=false};
  return ()=>{fin=true};
};

/* Сердечки: сколько раз можно врезаться. После неудачной попытки в следующий раз даётся на одно больше (до пяти) */
const fails6={};
function livesFor(key){return 3+Math.min(2,fails6[key]||0)}
// Сердечки в углу. st.sc — сколько звёздочек собрано: каждая вторая даёт сердечко (всего до шести),
// а после первой следующее сердечко уже заполнено наполовину
function heartPath(g,x,y,s){g.beginPath(); g.moveTo(x,y+s*.9); g.bezierCurveTo(x-s*1.6,y-s*.2,x-s*.7,y-s*1.3,x,y-s*.45); g.bezierCurveTo(x+s*.7,y-s*1.3,x+s*1.6,y-s*.2,x,y+s*.9)}
const heartSlot=(W,i)=>({x:14+W*.032+i*W*.032*2.3,y:W*.06});
function drawHearts(g,W,lives,max,st){
  const s=W*.032, half=st&&st.sc%2===1&&lives<6, slots=Math.max(max,lives+(half?1:0));
  for(let i=0;i<slots;i++){
    const {x,y}=heartSlot(W,i), pulse=st&&st.pulse>0&&i===lives-1?1+Math.sin(st.pulse/.4*Math.PI)*.45:1, q=s*pulse;
    heartPath(g,x,y,q); g.fillStyle='rgb(255 255 255/.55)'; g.fill();
    if(i<lives){heartPath(g,x,y,q); g.fillStyle='#e8436f'; g.fill()}
    else if(i===lives&&half){ g.save(); g.beginPath(); g.rect(x-s*2,y,s*4,s*2); g.clip(); heartPath(g,x,y,s); g.fillStyle='#f39ab4'; g.fill(); g.restore() }

}
function starHeart(st,x,y){
  st.sc=(st.sc||0)+1; st.fly=st.fly||[];
  if(st.sc%2===0&&st.lives+st.fly.length<6) st.fly.push({x0:x,y0:y,k:0});
}
// сердечко летит от места звёздочки в ряд в углу и только там добавляется
function flyHearts(g,st,W,dt){
  st.pulse=Math.max(0,(st.pulse||0)-dt);
  if(!st.fly||!st.fly.length) return;
  for(const f of st.fly){
    f.k=Math.min(1,f.k+dt/.7); const t=f.k, e=1-(1-t)*(1-t), to=heartSlot(W,st.lives);
    const x=f.x0+(to.x-f.x0)*e, y=f.y0+(to.y-f.y0)*e-Math.sin(t*Math.PI)*W*.12, s=W*.032*(1.6-.6*t);
    heartPath(g,x,y,s); g.fillStyle='#e8436f'; g.fill(); g.strokeStyle='#fff'; g.lineWidth=2; g.stroke();
    if(f.k>=1&&!f.done){ f.done=true; st.lives=Math.min(6,st.lives+1); st.maxH=Math.max(st.maxH||0,st.lives); st.pulse=.4; sfx.love() }
  }

}
function hitSay(t,lives){ // облачко про оставшиеся сердечки
  say(t,lives>0?`<b>Ой!</b> ${lives===1?'Осталось последнее сердечко!':`Осталось ${lives} ${plural(lives,'сердечко','сердечка','сердечек')}`}`:'<b>Ой-ой!</b>',1300)}
function failStage(st,stars0){
  // слишком много столкновений: попытка заканчивается, этап можно начать заново
  st.done=true; st.failed=true; stars6=stars0; const key=EPX[l2].key; fails6[key]=(fails6[key]||0)+1;

  setTimeout(()=>{ if(!st.failed||S2==null) return;
    talk2(S2,`Слишком много ударов… Ничего! Начнём сначала, и сердечек будет ${livesFor(key)}!`,3000);
    setHint('Сердечки закончились. Нажми, чтобы начать этап сначала');
    const z=$('r-tz'); if(z){z.textContent='Нажми — начать сначала'; z.style.opacity=1}
    st.canRetry=true },700);
}

/* Общий движок для пробежки и заплыва: мир едет влево, паук на месте, нажатие = прыжок или гребок */
function arcade(alive,cfg){
  room.className='room'; room.innerHTML=`<canvas class="cv" id="r-cv"></canvas><div class="tapzone" id="r-tz">${cfg.tapHint}</div>`;
  const cv=$('r-cv'), g=cv.getContext('2d');
  S2=makeMain('small free'); wearAll(S2,cfg.gear);
  const LIVES=livesFor(EPX[l2].key), stars0=stars6;
  const st={lives:LIVES,W:0,H:0,dist:0,obs:[],nextAt:0,y:0,vy:0,air:0,inv:0,slow:0,hits:0,last:performance.now(),done:false,t:0,lastOuch:0,tapped:false};
  function size(){const r=rr(),dpr=Math.min(2,devicePixelRatio||1); st.W=r.width; st.H=r.height; st.sw=S2.wrap.offsetWidth; st.ox=r.left; st.oy=r.top;
    cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); g.setTransform(dpr,0,0,dpr,0,0)}
  size(); cfg.init(st);
  let resized=false; const ro=new ResizeObserver(()=>{resized=true}); ro.observe(room);
  const L=cfg.length(st);
  handlers2={move(){},down(e){e.preventDefault&&e.preventDefault(); if(st.failed){ if(st.canRetry){st.canRetry=false;enter2(l2)} return }
    if((st.done&&!st.waitJump)||busy2) return; if(!st.tapped){st.tapped=true;$('r-tz').style.opacity=0} cfg.tap(st)}};
  const sr=()=>st.sw*.3; // радиус паука для столкновений
  function hitRect(cx,cy,r,x,y,w,h){const nx=Math.max(x,Math.min(cx,x+w)),ny=Math.max(y,Math.min(cy,y+h));return (cx-nx)**2+(cy-ny)**2<r*r}
  function ouch(){
    st.inv=1.3; st.slow=.7; st.hits++; st.lives--; S2.wrap.classList.add('blink'); restart(S2.btn,'shake'); sfx.yuck();
    if(st.lives<=0){ S2.wrap.classList.remove('blink'); failStage(st,stars0); return }
    hitSay(S2,st.lives);   // только облачко, без голоса: запуск речи на телефоне подтормаживает игру
  }
  function star(x,y,r){g.save();g.translate(x,y);g.rotate(st.t*1.5);g.beginPath();for(let i=0;i<10;i++){const q=i%2?r*.45:r,a=-Math.PI/2+i*Math.PI/5;g.lineTo(Math.cos(a)*q,Math.sin(a)*q)}g.closePath();g.fillStyle='#ffd23a';g.fill();g.strokeStyle='#e0a412';g.lineWidth=1.5;g.stroke();g.restore()}
  (function frame(){
    if(!alive()){ro.disconnect();return}
    const now=performance.now(), dt=Math.min(.05,(now-st.last)/1000); st.last=now; st.t+=dt;
    if(resized){resized=false;size()}
    const W=st.W,H=st.H, sx=W*.24;
    if(!st.done&&st.tapped){
      const v=cfg.speed(st)*(st.slow>0?.45:1); st.dist+=v*dt;
      st.slow=Math.max(0,st.slow-dt); st.inv=Math.max(0,st.inv-dt); if(st.inv<=0) S2.wrap.classList.remove('blink');
      while(st.nextAt<st.dist+W*1.2&&st.nextAt<L-W*.6){cfg.spawn(st,st.nextAt+W); st.nextAt+=cfg.gap(st)}
    }
    cfg.physics(st,dt);
    const prog=Math.min(1,st.dist/L), want=Math.floor(prog*EPX[l2].goal);
    if(want>p2&&!st.done){p2=want;render2()}
    // мир
    cfg.drawBg(g,st,L);
    const r=sr();
    for(const o of st.obs){
      o.sx=o.x-st.dist; if(o.sx<-W*.3||o.sx>W*1.3){if(o.sx<-W*.3)o.gone=true; continue}
      cfg.drawObs(g,o,st);
      if(o.star){ if(!o.got&&Math.hypot(o.sx-sx,o.sy-st.y)<r+W*.035){o.got=true;stars6++;starHeart(st,o.sx,o.sy);tone(1400,.08,'sine',0,.06);tone(1900,.12,'sine',.07,.05);burst(st.ox+o.sx,st.oy+o.sy,10,4)}
        else if(!o.got) star(o.sx,o.sy,W*.032); continue }
      if(st.inv<=0&&!st.done&&cfg.hits(o,st,sx,r,hitRect)) ouch();
    }
    st.obs=st.obs.filter(o=>!o.gone);
    g.font=`800 ${Math.round(W*.045)}px Nunito,system-ui,sans-serif`; g.fillStyle='#fff'; g.strokeStyle='rgb(0 0 0/.35)'; g.lineWidth=3; g.textAlign='right';
    g.strokeText(`⭐ ${stars6}`,W-12,W*.07); g.fillText(`⭐ ${stars6}`,W-12,W*.07); flyHearts(g,st,W,dt); drawHearts(g,W,st.lives,Math.max(LIVES,st.maxH||0),st);
    // паук двигается через transform: это не пересчитывает раскладку страницы
    S2.wrap.style.transform=`translate(${sx+(st.xoff||0)-st.sw/2}px,${st.y-st.sw*.425}px)`; S2.btn.style.rotate=(cfg.tilt?cfg.tilt(st,dt):0)+'deg';
    if(!st.done&&st.dist>=L){st.done=true; fails6[EPX[l2].key]=0; p2=EPX[l2].goal; render2(); cfg.finish(st)}
    requestAnimationFrame(frame);
  })();
  return st;
}

/* 2. Пробежка к бассейну: прыжки через препятствия, как в Geometry Dash */
let cfg_run=null;
SCENES.run=function(alive){
  setHint(`Нажми — прыжок, ещё раз в воздухе — выше! Сердечек ${livesFor('run')}, а каждые 2 звёздочки дают ещё одно`);
  setTimeout(()=>alive()&&!st.tapped&&talk2(S2,'Если нажать два раза, я прыгну выше!',2600),500);
  const ground=st=>st.H*.8;
  cfg_run={dive:async st=>{
    splash2({x:st.W*.24+st.xoff,y:ground(st)+st.H*.06}); sfx.water(); S2.wrap.classList.add('vanish');
    try{localStorage.setItem('spider-ep6-stars-run',String(stars6))}catch(e){}
    await wait(800); if(alive()) celebrate2();
  }};
  const st=arcade(alive,{
    gear:['cap','goggles','arms'], tapHint:'Нажми, чтобы бежать. Два нажатия — двойной прыжок',
    ouch:['Ой! Споткнулся!','Ай! Скользко!','Ух, мокрый пол!'],
    init(st){st.y=ground(st)-st.sw*.33; st.nextAt=st.W*.5},
    length:st=>st.W*.42*30, speed:st=>st.W*.42*(1+Math.min(.35,st.dist/(st.W*40))),
    gap:st=>st.W*(.55+Math.random()*.45),
    spawn(st,x){
      const t=pick(['flip','bucket','duck','ball','flip','duck']), W=st.W,H=st.H;
      const o={x,t,ph:Math.random()*6}; st.obs.push(o);
      if(Math.random()<.6) st.obs.push({x:x+(Math.random()<.5?0:W*.2),star:true,sy:ground(st)-H*(.28+Math.random()*.12)});
    },
    tap(st){
      if(st.waitJump){ // сама прыгаю в бассейн
        st.waitJump=false; st.diving=true; st.vy=-st.H*1.15; st.xoff=0; sfx.whoosh(); $('r-tz').style.opacity=0; talk2(S2,'Ура-а-а!',900); return }
      if(st.air<2){
        if(st.air===1){ st.doubles=(st.doubles||0)+1; if(st.doubles===1){ tone(880,.1,'sine',0,.06,1320); say(S2,'<b>Двойной прыжок!</b>',900) } $('r-tz').style.opacity=0 }
        st.vy=-st.H*(st.air?1.05:1.25); st.air++; sfx.jump() } },
    physics(st,dt){
      const gy=ground(st)-st.sw*.33;
      if(st.diving){ // полёт в бассейн
        st.xoff+=st.W*.42*dt; st.vy+=st.H*3.2*dt; st.y+=st.vy*dt;
        if(st.y>ground(st)+st.H*.04&&!st.splashed){st.splashed=true; cfg_run.dive(st)} return }
      if(st.y<gy||st.vy<0){st.vy+=st.H*3.6*dt; st.y+=st.vy*dt; if(st.y>=gy){st.y=gy;st.vy=0;st.air=0}}
      else {st.y=gy; st.air=0}
      // подсказка про двойной прыжок у первых прыжков, пока его ни разу не сделали
      if(!st.doubles&&st.air===1&&st.vy>-st.H*.35&&st.vy<st.H*.2&&(st.hintN||0)<4&&!st.hintOn){st.hintOn=true;st.hintN=(st.hintN||0)+1;const z=$('r-tz');z.textContent='Ещё раз — и выше!';z.style.opacity=1}
      if(st.hintOn&&(st.air===0||st.doubles)){st.hintOn=false;$('r-tz').style.opacity=0}
      S2.btn.classList.toggle('crawl',st.tapped&&st.air===0&&!st.done);
      if(st.done&&!st.diving) st.inv=1;
      for(const o of st.obs){ if(o.t==='duck') o.x-=st.W*.09*dt; }
    },
    drawBg(g,st,L){
      const W=st.W,H=st.H,gy=ground(st);
      g.fillStyle='#d8eef2'; g.fillRect(0,0,W,gy);
      g.strokeStyle='rgb(255 255 255/.9)'; g.lineWidth=2; const ts=W*.1, off=(st.dist*.5)%ts;
      for(let x=-off;x<W;x+=ts){g.beginPath();g.moveTo(x,0);g.lineTo(x,gy);g.stroke()} for(let y=ts;y<gy;y+=ts){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
      // окна и указатели
      for(let k=Math.floor(st.dist/(W*1.6));k<st.dist/(W*1.6)+2;k++){const x=k*W*1.6-st.dist*.5+W*.5; g.fillStyle='#9fd3ef'; g.fillRect(x,H*.12,W*.22,H*.18); g.strokeStyle='#fff';g.lineWidth=4;g.strokeRect(x,H*.12,W*.22,H*.18)}
      g.fillStyle='#e9e3d6'; g.fillRect(0,gy,W,H-gy); g.fillStyle='#e1d9c8'; const fs=W*.16, f2=st.dist%(fs*2);   // период = две плитки, иначе пол мигает
      for(let x=-f2;x<W;x+=fs*2) g.fillRect(x,gy,fs,H-gy);
      g.fillStyle='#bdb29a'; g.fillRect(0,gy,W,3);
      // бассейн в конце
      const px=L+W*.24-st.dist+W*.15; if(px<W){g.fillStyle='#3d9be0'; g.fillRect(px,gy+4,W*2,H-gy); g.fillStyle='#bfe6ff'; g.fillRect(px,gy+4,W*2,4)
        g.fillStyle='#2a2620'; g.font=`800 ${Math.round(W*.05)}px Nunito,sans-serif`; g.textAlign='left'; g.fillText('БАССЕЙН',px+8,gy-H*.06)}
    },
    drawObs(g,o,st){
      const W=st.W,H=st.H,gy=ground(st),x=o.sx;
      if(o.t==='flip'){g.fillStyle='#ff6fa8'; g.beginPath(); g.ellipse(x,gy-H*.018,W*.05,H*.018,0,0,7); g.fill(); g.strokeStyle='#fff'; g.lineWidth=3; g.beginPath(); g.arc(x,gy-H*.02,W*.025,Math.PI,0); g.stroke(); o.w=W*.1;o.h=H*.04}
      else if(o.t==='bucket'){o.w=W*.09;o.h=H*.11; g.fillStyle='#f5c03a'; g.beginPath(); g.moveTo(x-o.w/2,gy-o.h); g.lineTo(x+o.w/2,gy-o.h); g.lineTo(x+o.w*.38,gy); g.lineTo(x-o.w*.38,gy); g.fill(); g.strokeStyle='#c98f12'; g.lineWidth=2.5; g.beginPath(); g.arc(x,gy-o.h,o.w*.45,Math.PI,0); g.stroke()}
      else if(o.t==='duck'){o.w=W*.1;o.h=H*.085; const b=Math.sin(st.t*8+o.ph)*2; g.fillStyle='#ffd23a'; g.beginPath(); g.ellipse(x,gy-o.h*.38+b,o.w*.5,o.h*.38,0,0,7); g.fill(); g.beginPath(); g.arc(x+o.w*.25,gy-o.h*.82+b,o.h*.3,0,7); g.fill();
        g.fillStyle='#f39a2e'; g.beginPath(); g.moveTo(x+o.w*.48,gy-o.h*.86+b); g.lineTo(x+o.w*.7,gy-o.h*.78+b); g.lineTo(x+o.w*.48,gy-o.h*.7+b); g.fill(); g.fillStyle='#222'; g.beginPath(); g.arc(x+o.w*.3,gy-o.h*.9+b,2.2,0,7); g.fill()}
      else {const rr_=W*.045; o.by=gy-rr_-Math.abs(Math.sin(st.t*2.6+o.ph))*H*.24; o.r=rr_;
        ['#e8483c','#fff','#3d6fe0','#fff','#f5c03a','#fff'].forEach((c,i)=>{g.fillStyle=c;g.beginPath();g.moveTo(x,o.by);g.arc(x,o.by,rr_,i*Math.PI/3+st.t,(i+1)*Math.PI/3+st.t);g.fill()})}
    },
    hits(o,st,sx,r,hitRect){
      const gy=ground(st);
      if(o.t==='ball') return Math.hypot(o.sx-sx,o.by-st.y)<r+o.r*.9;
      return hitRect(sx,st.y,r*.85,o.sx-o.w/2,gy-o.h,o.w,o.h);
    },
    finish(st){
      // мир остановился у края бассейна: прыгать в воду игрок решает сам
      S2.btn.classList.remove('crawl'); st.waitJump=true; st.inv=0; S2.wrap.classList.remove('blink');
      talk2(S2,'Вот он, бассейн! Прыгаем?',2000); setHint('Нажми, и паук прыгнет в бассейн!');
      const z=$('r-tz'); z.textContent='Нажми — прыжок в бассейн!'; z.style.opacity=1;
    }
  });
};

/* 3. Первые гребки: левой, правой, по очереди */
SCENES.strokes=function(alive){
  try{stars6=+localStorage.getItem('spider-ep6-stars-run')||stars6}catch(e){}
  room.className='room poolside';
  room.innerHTML=`<div class="waves"></div><div class="paddles"><button id="r-pl">◀ Левой лапкой</button><button id="r-pr">Правой лапкой ▶</button></div>`;
  const s=rr(); const C=coachAt(s.width*.86,s.height*.28);
  S2=makeMain('small'); wearAll(S2,['cap','goggles','arms']); put(S2,{x:s.width*.14,y:s.height*.52});
  setHint('Греби лапками по очереди: левой, правой, левой…');
  let last=null, lock=false;
  setTimeout(()=>alive()&&talk2(C,'Ква! Греби по очереди: левой, правой!',2800),400);
  const COUNT=['Раз!','Два!','Три!','Четыре!','Пять!','Шесть!','Семь!','Восемь!','Девять!','Десять!','Одиннадцать!','Двенадцать!'];
  const hintBtn=()=>{$('r-pl').classList.toggle('hint',last!=='L');$('r-pr').classList.toggle('hint',last!=='R')};
  hintBtn();
  function stroke(side){
    if(lock||busy2) return;
    const btn=$(side==='L'?'r-pl':'r-pr'); 
    if(side===last){ restart(S2.btn,'shake'); sfx.yuck(); talk2(C,'Теперь другой лапкой!',1300); return }
    last=side; hintBtn(); lock=true; setTimeout(()=>lock=false,260);
    const legs=S2.btn.querySelector(side==='L'?'.legs-l':'.legs-r'); legs.style.transition='rotate .15s'; legs.style.rotate=side==='L'?'-22deg':'22deg'; setTimeout(()=>{legs.style.rotate=''},170);
    const r=rr(); const x=r.width*(.14+.66*(p2+1)/EPX[l2].goal);
    const w=document.createElement('div'); w.className='ripple2'; w.style.left=S2.wrap.offsetLeft+'px'; w.style.top=(r.height*.56)+'px'; room.appendChild(w); setTimeout(()=>w.remove(),900);
    put(S2,{x,y:r.height*.52}); tone(side==='L'?520:620,.12,'sine',0,.06); sfx.water();
    add2(1,false); speak(COUNT[p2-1],1.25,1.1,'coach',1);
    if(p2>=EPX[l2].goal){ setTimeout(()=>{ if(!alive())return; talk2(C,'Молодец! Теперь настоящий заплыв!'); setTimeout(()=>alive()&&celebrate2(),1500)},500) }
  }
  $('r-pl').onclick=()=>stroke('L'); $('r-pr').onclick=()=>stroke('R');
};

/* 4. Заплыв: как во Flappy Bird — паук тонет, нажатие = гребок вверх */
SCENES.swim=function(alive){
  try{stars6=+localStorage.getItem('spider-ep6-stars-run')||stars6}catch(e){}
  setHint(`Нажимай, чтобы грести вверх, и проплывай между поплавками. Сердечек ${livesFor('swim')}, 2 звёздочки — ещё сердечко`);
  const top=st=>st.H*.1, bot=st=>st.H*.9;
  arcade(alive,{
    gear:['cap','goggles','arms'], tapHint:'Нажми, чтобы плыть',
    ouch:['Ой! Буль!','Ай, поплавок!','Ух! Чуть не врезался!'],
    init(st){st.y=st.H*.5; st.nextAt=st.W*.55},
    length:st=>st.W*.36*38, speed:st=>st.W*.36,
    gap:st=>st.W*(.62+Math.random()*.3),
    spawn(st,x){
      const H=st.H, k=Math.min(1,st.dist/(st.W*.36*30));            // чем дальше, тем труднее
      const t=Math.random()<.62?'gate':pick(['ball','fish']);
      const gapH=H*(.4-.08*k), mid=H*(.28+Math.random()*.44);
      const o={x,t,mid,gapH,amp:t==='gate'&&Math.random()<.25+.45*k?H*(.06+.06*Math.random()):0,ph:Math.random()*6,sp:1+Math.random()*.8};
      st.obs.push(o);
      if(Math.random()<.7) st.obs.push({x:x+(t==='gate'?0:st.W*.3),star:true,sy:t==='gate'?mid:H*(.25+Math.random()*.5),gate:o});
    },
    tap(st){ st.push=.18; sfx.water(); S2.btn.classList.add('crawl'); clearTimeout(st.pt); st.pt=setTimeout(()=>S2.btn.classList.remove('crawl'),350) },
    physics(st,dt){
      if(!st.tapped){st.y=st.H*.5+Math.sin(st.t*2)*6; return}
      // гребок разгоняет вверх не мгновенно, а за долю секунды
      if(st.push>0){const k=Math.min(dt,st.push); st.push-=dt; st.vy=Math.max(-st.H*.62,st.vy-st.H*4.6*k)}
      st.vy=Math.min(st.vy+st.H*1.15*dt,st.H*.55); st.y+=st.vy*dt;
      const r=st.sw*.3; if(st.y<top(st)+r){st.y=top(st)+r;st.vy=Math.max(0,st.vy)} if(st.y>bot(st)-r){st.y=bot(st)-r;st.vy=Math.min(0,st.vy)}
      for(const o of st.obs){ if(o.star&&o.gate) o.sy=o.gate.cy??o.sy; }
    },
    tilt:(st,dt)=>{const want=Math.max(-20,Math.min(20,st.vy/st.H*34)); st.tl=(st.tl||0)+(want-(st.tl||0))*Math.min(1,dt*6); return st.tl},   // наклон догоняет плавно

      st.rv+=(BASE()*(1+gapK)-st.rv)*Math.min(1,dt*2); st.rx+=st.rv*dt;
      // соперник оплывает игрушки (почти всегда)
      if(R6.lanes){ const ahead=st.obs.find(o=>o.lane<2&&o.lane===st.rl&&o.x>st.rx&&o.x-st.rx<W*.35); if(ahead&&ahead.dodge) st.rl=1-st.rl }
      // столкновения с игрушками
      for(const o of st.obs){ if(!o.r) continue;
        if(o.lane===st.pl&&st.pinv<=0&&Math.abs(o.x-st.px)<r*.8+o.r&&Math.abs(ly[o.lane]-st.py)<r){st.pinv=1;st.pv*=.25;restart(S2.btn,'shake');sfx.yuck();say(S2,pick(['<b>Ой!</b> Игрушка!','<b>Буль!</b>','<b>Ай!</b> Уточка!']),900)}
        if(o.lane===st.rl&&st.rinv<=0&&Math.abs(o.x-st.rx)<r*.8+o.r&&Math.abs(ly[o.lane]-st.ry)<r){st.rinv=1;st.rv*=.3;restart(P.btn,'shake');say(P,'<b>Ай!</b> Кто тут плавает?!',1000)}
      }
      P.btn.classList.add('crawl');
      const lead=st.px>st.rx+W*.05?'me':st.rx>st.px+W*.05?'him':st.lead;
      if(lead!==st.lead&&now-st.taunt>2200){st.taunt=now; st.lead=lead; say(P,bold(pick(lead==='me'?R6.behind:R6.lead)),1300)}
      const m=Math.floor(Math.min(1,st.px/L())*25); if(m>p2){p2=m;render2()}
      if(st.px>=L()||st.rx>=L()){ const win=st.px>=st.rx; p2=win?25:p2; render2(); finish(win) }
    }
    st.py+=(ly[st.pl]-st.py)*Math.min(1,dt*10); st.ry+=(ly[st.rl]-st.ry)*Math.min(1,dt*7);
    st.cam+=(Math.max(0,Math.min(L()+W*.25-W,(st.px+st.rx)/2-W*.35))-st.cam)*Math.min(1,dt*4);
    const c=st.cam;
    g.fillStyle='#3d9be0'; g.fillRect(0,0,W,H); g.fillStyle='#d8eef2'; g.fillRect(0,0,W,H*.14); g.fillRect(0,H*.86,W,H*.14);
    const ropes=R6.lanes?[[H*.18,1],[H*.34,.6],[H*.51,1],[H*.69,.6],[H*.83,1]]:[[H*.2,1],[H*.51,1],[H*.82,1]];
    for(const [y,a] of ropes){ g.globalAlpha=a; for(let x=-(c%24),i=Math.floor(c/24);x<W;x+=24,i++){g.fillStyle=i%2?'#e8483c':'#fff';g.beginPath();g.ellipse(x,y,10,a<1?5:7,0,0,7);g.fill()} g.globalAlpha=1 }
    g.fillStyle='rgb(29 79 138/.6)'; for(const y of ly) g.fillRect(0,y+st.sw*.42,W,3);
    g.fillStyle='rgb(255 255 255/.75)'; g.font=`800 ${Math.round(W*.04)}px Nunito,sans-serif`; g.textAlign='center';
    for(let m=5;m<25;m+=5){const x=m/25*L()-c+off; if(x>-30&&x<W+30){g.fillRect(x-1,H*.14,2,H*.72); g.fillText(m+' м',x,H*.11)}}
    const fx=L()-c+off+st.sw*.4; if(fx<W+20){g.fillStyle='#f1e7d6'; g.fillRect(fx,H*.14,W,H*.72); g.fillStyle='#f5c03a'; g.fillRect(fx-6,H*.14,6,H*.72)}
    for(const o of st.obs){ const x=o.x-c+off; if(x<-60||x>W+60){o.r=o.r||W*.05;continue} drawToy(o,x,ly[o.lane],W) }
    g.fillStyle='#fff'; g.font=`800 ${Math.round(W*.04)}px Nunito,sans-serif`; g.textAlign='left';
    g.fillText(R6.name,8,(R6.lanes?H*.18:ly[0])-(R6.lanes?6:st.sw*.5)); g.fillText('Ты',8,(R6.lanes?H*.51:ly[2])-(R6.lanes?6:st.sw*.5));
    S2.wrap.style.transform=`translate(${st.px-c+off-st.sw/2}px,${st.py-st.sw*.425}px)`;
    P.wrap.style.transform=`translate(${st.rx-c+off-st.sw/2}px,${st.ry-st.sw*.425}px)`;
    requestAnimationFrame(frame);
  })();
}
SCENES.race=alive=>raceScene(alive,'purple');
SCENES.race2=alive=>raceScene(alive,'red');

/* 5. Награждение */
SCENES.medal=function(alive){
  try{stars6=+localStorage.getItem('spider-ep6-stars-run')||stars6}catch(e){}
  room.className='room locker';
  room.innerHTML=`<div class="wall"></div><div class="floor"></div><div class="podium" id="r-pod"><div style="height:44px">2</div><div style="height:72px;background:#e0b04a">1</div><div style="height:30px">3</div></div>
    <button class="medalbtn" id="r-medal" aria-label="Медаль"><svg viewBox="0 0 60 80"><path d="M18 0 L30 34 L42 0" stroke="#3d6fe0" stroke-width="8" fill="none"/><circle cx="30" cy="52" r="22" fill="#f5c03a" stroke="#c98f12" stroke-width="4"/><path d="M30 38 l4 9 10 1 -7 7 2 10 -9 -5 -9 5 2 -10 -7 -7 10 -1z" fill="#fff8"/></svg></button>`;
  const s=rr(), pod=$('r-pod'); const C=coachAt(s.width*.18,s.height*.45);
  S2=makeMain(); wearAll(S2,['cap','goggles']);
  const top1=anchor(pod.children[1],.5,0); put(S2,{x:top1.x,y:top1.y-S2.wrap.offsetWidth*.38});
  const P=makeWalker('purple small',{pitch:1.7,rate:1.15,who:'purple',voice:1,label:'Фиолетовый паук'}); P.wrap.classList.add('w-cap','w-goggles');
  const top2=anchor(pod.children[0],.5,0); put(P,{x:top2.x,y:top2.y-P.wrap.offsetWidth*.32});
  const Rd=makeWalker('red small',{pitch:1.05,rate:1.15,who:'red',voice:0,label:'Красный паук'}); Rd.wrap.classList.add('w-cap','w-goggles');
  const top3=anchor(pod.children[2],.5,0); put(Rd,{x:top3.x,y:top3.y-Rd.wrap.offsetWidth*.32});
  const m=$('r-medal'); m.style.left=(s.width*.78)+'px'; m.style.top=(s.height*.3)+'px'; m.style.translate='-50% -50%'; tapme(m,true);
  setHint('Нажми на медаль, и тренер наградит паука');
  setTimeout(()=>alive()&&talk2(C,'Ква! Награждается чемпион заплыва… чёрный паук!',3200),400);
  setTimeout(()=>alive()&&!m.disabled&&talk2(P,'Ты был быстрее меня! Поздравляю!',2600),3900);
  m.onclick=async()=>{
    if(m.disabled) return; m.disabled=true; tapme(m,false);
    const sp=S2.wrap.getBoundingClientRect(), rm=rr(); m.style.left=(sp.left-rm.left+sp.width/2)+'px'; m.style.top=(sp.top-rm.top+sp.height*.62)+'px'; m.style.scale='.4'; sfx.whoosh();
    await wait(950); if(!alive())return;
    m.remove(); S2.wrap.classList.add('w-medal'); restart(S2.btn,'jump'); sfx.fanfare(); banner('Чемпион!'); add2(1,false);
    for(let k=0;k<4;k++) setTimeout(()=>burst(rand(.15,.85)*innerWidth,rand(.25,.5)*innerHeight,55,10),k*300);
    talk2(S2,`Ура! Я научился плавать! И собрал ${stars6} ${plural(stars6,'звёздочку','звёздочки','звёздочек')}!`,3200);
    setTimeout(()=>{ if(!alive())return; P.wrap.classList.add('w-medal','silver'); restart(P.btn,'jump'); sfx.magic();
      speak('Ура, серебро!',P.pitch,P.rate,P.who,P.voice); burst(rr().left+P.wrap.offsetLeft,rr().top+P.wrap.offsetTop,16,5) },3500);
    setTimeout(()=>{ if(!alive())return; Rd.wrap.classList.add('w-medal','bronze'); restart(Rd.btn,'jump'); sfx.magic(); speak('Бронза — тоже медаль!',Rd.pitch,Rd.rate,Rd.who,Rd.voice); burst(rr().left+Rd.wrap.offsetLeft,rr().top+Rd.wrap.offsetTop,16,5) },5600);   // коротко, чтобы облачко не закрывало чемпиона
    try{ if(stars6>lsGet('spider-ep6-stars',-1)) lsSet('spider-ep6-stars',stars6) }catch(e){}
    EPS.fin=['Паук научился плавать!',`Медаль и ${stars6} ⭐`];
    l2=EPX.length; lsSet(EPS.store,l2); render2();
  };
};

if(hot?.episode===1) startEp1();
else if(STORIES[hot?.episode]) startStory(hot.episode,hot.l2|0);
else showMenu();
